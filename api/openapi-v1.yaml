          content:
            application/json:
              schema: {type: object, required: [code, message, requestId, data], properties: {code: {type: string, enum: [OK]}, message: {type: string, enum: [success]}, requestId: {type: string}, data: {$ref: '#/components/schemas/OpenAPISnapshotLibraryResponse'}}}
        '400': *invalidRequestResponse
        '401': *authenticationFailedResponse
        '403': *capabilityDeniedResponse
        '404': *resourceNotFoundResponse
        '405': *methodNotAllowedResponse
        '429': *rateLimitedResponse
        '503': *serviceUnavailableResponse
    delete:
      operationId: deleteChannelSnapshotLibrary
      summary: "批量删除抓拍图"
      description: >-
        彻底删除该通道图像库中的指定抓拍图：库行与磁盘文件一并删除且不可恢复，必须显式确认。
        一次最多 100 个主键。只删除本通道且部门可见范围内的图；不在范围内的主键与已不存在的主键
        统一计入 missing，调用方无法据此探测其他通道图片是否存在。
        删除顺序为先删文件再删库行，因此 filesFailed 大于 0 表示库行已删但文件残留，需要运维清理。
      x-uvp-scope: channel:snapshot:library:delete
      x-uvp-risk: destructive
      x-uvp-idempotency-mode: optional
      x-uvp-protocol-versions: ["2016", "2022"]
      x-uvp-standard-refs: ["平台图像库保留策略；删除语义由平台定义，非协议命令"]
