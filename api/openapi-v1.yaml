              schema: {type: object, required: [code, message, requestId, data], properties: {code: {type: string, enum: [OK]}, message: {type: string, enum: [success]}, requestId: {type: string}, data: {$ref: '#/components/schemas/OpenAPISnapshotSession'}}}
