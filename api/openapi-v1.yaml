          type: string
          format: date-time
          description: 图片抓拍时间
        contentUrl:
          type: string
          description: 读取图片内容的签名 GET 路径；需对完整查询串重新签名
    OpenAPISnapshotImageContent:
      type: object
      additionalProperties: false
      required:
        - fileName
        - contentType
        - size
        - md5
        - contentBase64
      properties:
        fileName:
          type: string
          description: 图像文件名。
        contentType:
          type: string
          description: 媒体内容类型。
        size:
          type: integer
          minimum: 0
          description: 图像字节大小。
        md5:
          type: string
          description: 图像字节的 MD5 摘要。
        contentBase64:
          type: string
          description: 图像原始字节的 Base64 编码。
    OpenAPISnapshotLibraryItem:
      type: object
      additionalProperties: false
      required:
        - snapshotId
        - fileName
        - size
        - md5
        - source
        - capturedAt
        - receivedAt
        - contentUrl
      properties:
        snapshotId:
          type: integer
          minimum: 1
          description: 图像库主键。
        sessionId:
          type: string
          description: Only present for images produced by a capture session.
        fileName:
          type: string
          description: 图像文件名。
        size:
          type: integer
          minimum: 0
          description: 图像字节大小。
        md5:
          type: string
          description: 图像字节的 MD5 摘要。
        source:
          type: string
          enum:
            - device
            - zlm
            - browser
          description: 事件来源。
        capturedAt:
          type: string
          format: date-time
          description: Capture time parsed from the device file name; not the platform receive time.
        receivedAt:
          type: string
          format: date-time
          description: 平台接收时间。
        contentUrl:
          type: string
          description: Path of the content endpoint for this image.
    OpenAPISnapshotLibraryResponse:
      type: object
      additionalProperties: false
      required:
        - items
        - page
        - pageSize
        - total
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/OpenAPISnapshotLibraryItem"
          description: 本页结果；没有记录时返回空数组。
        page:
          type: integer
          minimum: 1
          description: 当前页码，从 1 开始。
        pageSize:
          type: integer
          minimum: 1
          description: 每页条数。
        total:
          type: integer
          minimum: 0
          description: 匹配筛选条件的总条数。
    OpenAPISnapshotLibraryDeleteResponse:
      type: object
      additionalProperties: false
      required:
        - deleted
        - filesFailed
        - missing
      properties:
        deleted:
          type: integer
          minimum: 0
          description: 成功删除的条数。
        filesFailed:
          type: integer
          minimum: 0
          description: Rows removed while the file could not be deleted; orphans need manual cleanup.
        missing:
          type: integer
          minimum: 0
          description: Ids that were absent or outside this channel and department scope; the two cases are deliberately indistinguishable.
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - requestId
        - data
      properties:
        code:
          type: string
          enum:
            - INVALID_REQUEST
            - AUTHENTICATION_FAILED
            - REQUEST_EXPIRED
            - REQUEST_REPLAYED
            - CAPABILITY_DENIED
            - CAPABILITY_NOT_SUPPORTED
            - DEVICE_OFFLINE
            - RESOURCE_NOT_FOUND
            - CONFLICT
            - RATE_LIMITED
            - QUOTA_EXCEEDED
            - SERVICE_UNAVAILABLE
          description: 业务结果码；成功为 OK。
        message:
          type: string
          description: 结果说明；成功为 success。
        requestId:
          type: string
          description: 平台生成的请求追踪标识。
        data:
          type: object
          nullable: true
          description: 业务返回数据。
    Device:
      type: object
      description: 设备列表与设备详情共用的完整设备信息。时间字段始终返回，未知时为 null；不包含设备密码或内部管理标识。
      additionalProperties: false
      required:
        - deviceId
        - name
        - alias
        - manufacturer
        - model
        - status
        - firmware
        - transport
        - ip
        - port
        - registerTime
        - registerExpireAt
        - keepaliveTime
        - keepaliveInterval
        - expires
        - offlineAt
        - channelCount
        - onlineChannelCount
        - reportedVersion
        - effectiveVersion
        - effectiveVersionSource
        - effectiveVersionAt
        - protocolOverride
        - subscribeCapability
        - subscribeLastTest
        - subscribeExpiresAt
        - reportedCharset
        - wireCharset
        - reportedCharsetAt
        - createdAt
        - updatedAt
      properties:
        deviceId:
          type: string
          description: 设备国标编码，20 位数字字符串。
          example: "34020000002000000001"
          pattern: ^[0-9]{20}$
        name:
          type: string
          description: 设备上报的名称；未上报时为空字符串。
          example: 门店视频设备
        alias:
          type: string
          description: 平台配置的别名；未设置时为空字符串。
          example: 一楼门店
        manufacturer:
          type: string
          description: 设备上报的厂商；未上报时为空字符串。
          example: 示例厂商
        model:
          type: string
          description: 设备上报的型号；未上报时为空字符串。
          example: IPC-28181
        status:
          type: string
          description: 平台记录的在线状态：online 在线，offline 离线，unknown 状态未知。
          example: online
          enum:
            - online
            - offline
            - unknown
        firmware:
          type: string
          description: 设备上报的固件版本；未上报时为空字符串。
          example: V1.0.0
        transport:
          type: string
          description: 设备 SIP 信令传输方式，通常为 UDP 或 TCP；未知时为空字符串。
          example: TCP
        ip:
          type: string
          description: 平台记录的设备 SIP 来源 IP 地址；未知时为空字符串。
          example: 192.0.2.10
        port:
          type: integer
          format: int32
          description: 平台记录的设备 SIP 来源端口；未知时为 0。
          example: 5060
        registerTime:
          type: string
          description: 最近一次注册成功时间。 未知或尚未发生时返回 null。
          example: 2026-11-09T08:00:00Z
          format: date-time
          nullable: true
        registerExpireAt:
          type: string
          description: 当前注册的到期时间。 未知或尚未发生时返回 null。
          example: 2026-11-09T09:00:00Z
          format: date-time
          nullable: true
        keepaliveTime:
          type: string
          description: 最近一次收到设备心跳的时间。 未知或尚未发生时返回 null。
          example: 2026-11-09T08:05:00Z
          format: date-time
          nullable: true
        keepaliveInterval:
          type: integer
          format: int32
          description: 设备期望心跳周期，单位秒；0 表示尚无有效记录。
          example: 60
        expires:
          type: integer
          format: int32
          description: 设备注册有效期，单位秒；0 表示尚无有效记录。
          example: 3600
        offlineAt:
          type: string
          description: 最近一次被平台判定离线的时间。 未知或尚未发生时返回 null。
          example: null
          format: date-time
          nullable: true
        channelCount:
          type: integer
          format: int64
          description: 当前设备下对本客户端可见的通道总数；仅统计与设备同归属部门、未删除且设备与通道编码链唯一的通道。
          example: 2
          minimum: 0
        onlineChannelCount:
          type: integer
          format: int64
          description: 可见通道中在线的数量；统计口径与 channelCount 一致，在线状态为 online。
          example: 1
          minimum: 0
        reportedVersion:
          type: string
          description: 设备最近一次上报的原始协议版本声明，通常为 2016 或 2022；尚未声明时为空字符串。
          example: "2022"
        effectiveVersion:
          type: string
          description: 平台当前实际采用的协议版本，通常为 2016 或 2022；历史记录缺失时可能为空字符串。
          example: "2022"
        effectiveVersionSource:
          type: string
          description: 当前协议版本的来源：register 注册声明、override 人工覆盖、history 历史事实、default 平台默认；未记录时为空字符串。
          example: register
        effectiveVersionAt:
          type: string
          description: 当前生效协议版本最近一次确认或更新时间。 未知或尚未发生时返回 null。
          example: 2026-11-09T08:00:00Z
          format: date-time
          nullable: true
        protocolOverride:
          type: string
          description: 平台配置的协议版本覆盖策略：auto 自动、2016 或 2022 固定版本；历史记录缺失时可能为空字符串。
          example: auto
        subscribeCapability:
          type: string
          description: 目录订阅状态：unknown 尚未确认、subscribed 已订阅、fallback 已降级为轮询；历史记录缺失时可能为空字符串。
          example: subscribed
          enum:
            - ""
            - unknown
            - subscribed
            - fallback
        subscribeLastTest:
          type: string
          description: 最近一次尝试发送目录订阅的时间。 未知或尚未发生时返回 null。
          example: 2026-11-09T08:00:00Z
          format: date-time
          nullable: true
        subscribeExpiresAt:
          type: string
          description: 当前目录订阅的到期时间。 未知或尚未发生时返回 null。
          example: 2026-11-09T09:00:00Z
          format: date-time
          nullable: true
        reportedCharset:
          type: string
          description: 设备最近一次 XML 报文声明的原始字符集；未声明或尚无报文时为空字符串。
          example: GB18030
        wireCharset:
          type: string
          description: 平台实际判定用于解码设备报文的字符集；尚无报文时为空字符串。
          example: GB18030
        reportedCharsetAt:
          type: string
          description: 最近一次字符集事实确认时间。 未知或尚未发生时返回 null。
          example: 2026-11-09T08:00:00Z
          format: date-time
          nullable: true
        createdAt:
          type: string
          description: 平台设备记录创建时间。 未知或尚未发生时返回 null。
          example: 2026-11-01T08:00:00Z
          format: date-time
          nullable: true
        updatedAt:
          type: string
          description: 平台设备记录最近更新时间。 未知或尚未发生时返回 null。
          example: 2026-11-09T08:05:00Z
          format: date-time
          nullable: true
      example:
        deviceId: "34020000002000000001"
        name: 门店视频设备
        alias: 一楼门店
        manufacturer: 示例厂商
        model: IPC-28181
        status: online
        firmware: V1.0.0
        transport: TCP
        ip: 192.0.2.10
        port: 5060
        registerTime: 2026-11-09T08:00:00Z
        registerExpireAt: 2026-11-09T09:00:00Z
        keepaliveTime: 2026-11-09T08:05:00Z
        keepaliveInterval: 60
        expires: 3600
        offlineAt: null
        channelCount: 2
        onlineChannelCount: 1
        reportedVersion: "2022"
        effectiveVersion: "2022"
        effectiveVersionSource: register
        effectiveVersionAt: 2026-11-09T08:00:00Z
        protocolOverride: auto
        subscribeCapability: subscribed
        subscribeLastTest: 2026-11-09T08:00:00Z
        subscribeExpiresAt: 2026-11-09T09:00:00Z
        reportedCharset: GB18030
        wireCharset: GB18030
        reportedCharsetAt: 2026-11-09T08:00:00Z
        createdAt: 2026-11-01T08:00:00Z
        updatedAt: 2026-11-09T08:05:00Z
    DevicePage:
      type: object
      additionalProperties: false
      required:
        - items
        - page
        - pageSize
        - total
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Device"
          description: 本页结果；没有记录时返回空数组。
        page:
          type: integer
          minimum: 1
          description: 当前页码，从 1 开始。
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
          description: 每页条数。
        total:
          type: integer
          format: int64
          minimum: 0
          description: 匹配筛选条件的总条数。
    DeviceStatus:
      type: object
      required:
        - deviceId
        - status
        - online
        - registerTime
        - registerExpireAt
        - keepaliveTime
        - keepaliveInterval
        - expires
        - offlineAt
        - protocolVersion
      additionalProperties: false
      properties:
        deviceId:
          type: string
          description: 设备国标编码，20 位数字
          pattern: ^[0-9]{20}$
        status:
          type: string
          description: 数据库确认的在线状态；未确认或异常值返回 unknown
          enum:
            - online
            - offline
            - unknown
        online:
          type: boolean
          nullable: true
          description: online=true，offline=false，unknown=null；不根据心跳时间臆测
        registerTime:
          type: string
          format: date-time
          nullable: true
          description: 最近注册时间，未知为 null
        registerExpireAt:
          type: string
          format: date-time
          nullable: true
          description: 注册有效期截止时间，未知为 null
        keepaliveTime:
          type: string
          format: date-time
          nullable: true
          description: 最近心跳时间，未知为 null
        keepaliveInterval:
          type: integer
          description: 心跳间隔，单位秒
        expires:
          type: integer
          description: 注册有效期，单位秒
        offlineAt:
          type: string
          format: date-time
          nullable: true
          description: 最近离线时间，未知为 null
        protocolVersion:
          type: string
          description: 当前生效的 GB28181 协议版本
    Channel:
      type: object
      description: 通道列表与通道详情共用的完整通道信息。设备未上报的目录属性保留空字符串或 0，时间未知时为 null；不直接暴露内部快照地址。
      additionalProperties: false
      required:
        - deviceId
        - channelId
        - name
        - alias
        - manufacturer
        - model
        - status
        - ptzType
        - owner
        - civilCode
        - parentId
        - roomType
        - supplyLightType
        - directionType
        - resolution
        - positionType
        - useType
        - photoelectricImagingType
        - capturePositionType
        - streamNumberList
        - ipAddress
        - port
        - longitude
        - latitude
        - positionSource
        - positionUpdatedAt
        - statusEvent
        - streamId
        - onDemandLive
        - streamTransport
        - audioEnabled
        - recordingMode
        - cloudRecordingEnabled
        - cloudRecordingState
        - cloudRecordingError
        - cloudRecordingUpdatedAt
        - snapshotAt
        - createdAt
        - updatedAt
      properties:
        deviceId:
          type: string
          description: 设备国标编码，20 位数字字符串。
          example: "34020000002000000001"
          pattern: ^[0-9]{20}$
        channelId:
          type: string
          description: 通道国标编码，20 位数字字符串；通过 deviceId 关联所属设备。
          example: "34020000001320000001"
          pattern: ^[0-9]{20}$
        name:
          type: string
          description: 设备目录上报的通道名称；未上报时为空字符串。
          example: 门店入口
        alias:
          type: string
          description: 平台配置的别名；未设置时为空字符串。
          example: 一楼门店
        manufacturer:
          type: string
          description: 设备上报的厂商；未上报时为空字符串。
          example: 示例厂商
        model:
          type: string
          description: 设备上报的型号；未上报时为空字符串。
          example: IPC-28181
        status:
          type: string
          description: 平台记录的在线状态：online 在线，offline 离线，unknown 状态未知。
          example: online
          enum:
            - online
            - offline
            - unknown
        ptzType:
          type: integer
          format: int32
          description: 设备上报的云台类型：0 未知，1 球机，2 半球，3 固定枪机，4 遥控枪机，5 遥控半球，6 多目全景或拼接通道，7 多目分割通道；5 至 7 为 2022 版扩展。
          example: 1
        owner:
          type: string
          description: 设备目录上报的通道所属单位；未上报时为空字符串。
          example: 门店
        civilCode:
          type: string
          description: 设备目录上报的行政区划编码；未上报时为空字符串。
          example: "340200"
        parentId:
          type: string
          description: 设备目录上报的父节点编码；2022 版多个父节点按 / 分隔原样保留，未上报时为空字符串。
          example: "34020000002000000001"
        roomType:
          type: integer
          format: int32
          description: 设备上报的室内外属性：0 未上报，1 室外，2 室内。
          example: 2
        supplyLightType:
          type: integer
          format: int32
          description: 设备上报的补光方式：0 未上报，1 无补光，2 红外，3 白光，4 激光，9 其他。
          example: 2
        directionType:
          type: integer
          format: int32
          description: 设备上报的摄像机方向代码；0 表示未上报，其他值保留设备原始代码。
          example: 0
        resolution:
          type: string
          description: 设备上报的分辨率，如 1920*1080；未上报时为空字符串。
          example: 1920*1080
        positionType:
          type: integer
          format: int32
          description: 2016 版目录中的位置类型原始代码；0 表示未上报，如 1 为省际检查站、10 为交通干线。
          example: 0
        useType:
          type: integer
          format: int32
          description: 2016 版目录中的用途代码：0 未上报，1 治安，2 交通，3 重点。
          example: 1
        photoelectricImagingType:
          type: string
          description: 2022 版目录中的光电成像类型原始代码；多个值按 / 分隔，未上报时为空字符串。
          example: "1"
        capturePositionType:
          type: string
          description: 2022 版目录中的采集部位类型原始代码；未上报时为空字符串。
          example: "1"
        streamNumberList:
          type: string
          description: 2022 版设备声明支持的码流编号，多个编号按 / 分隔；未上报时为空字符串。
          example: 0/1
        ipAddress:
          type: string
          description: 设备在目录中声明的通道取流 IP 地址；未上报时为空字符串。
          example: 192.0.2.20
        port:
          type: integer
          format: int32
          description: 设备在目录中声明的通道取流端口；未上报时为 0。
          example: 0
        longitude:
          type: number
          format: double
          description: 通道当前经度；未记录时为 0，须结合 positionSource 与 positionUpdatedAt 判断是否有位置事实。
          example: 118.38
        latitude:
          type: number
          format: double
          description: 通道当前纬度；未记录时为 0，须结合 positionSource 与 positionUpdatedAt 判断是否有位置事实。
          example: 31.33
        positionSource:
          type: string
          description: 位置来源：catalog 设备目录、mobile 移动位置上报、manual 平台人工录入；空字符串表示尚无坐标来源。
          example: catalog
          enum:
            - ""
            - catalog
            - mobile
            - manual
        positionUpdatedAt:
          type: string
          description: 通道位置最近更新时间。 未知或尚未发生时返回 null。
          example: 2026-11-09T08:05:00Z
          format: date-time
          nullable: true
        statusEvent:
          type: string
          description: 设备目录上报的故障事件：VLOST 视频丢失、DEFECT 设备故障；空字符串表示无已记录故障事件。
          example: ""
        streamId:
          type: string
          description: 平台当前记录的直播媒体流标识；没有活动直播流时通常为空字符串，不作为会话归属凭据。
          example: ""
        onDemandLive:
          type: boolean
          description: 是否按需直播；true 表示无人观看时允许自动关闭直播。
          example: true
        streamTransport:
          type: string
          description: 平台配置的媒体流传输模式：UDP、TCP-Active 或 TCP-Passive；历史记录缺失时可能为空字符串。
          example: TCP-Passive
        audioEnabled:
          type: boolean
          description: 点播取流是否接收音频；true 表示接收音频。
          example: true
        recordingMode:
          type: string
          description: 平台配置的录像模式：off 关闭、continuous 连续、scheduled 按计划；历史记录缺失时可能为空字符串。
          example: off
        cloudRecordingEnabled:
          type: boolean
          description: 平台期望的云端录像开关；实际运行情况以 cloudRecordingState 为准。
          example: false
        cloudRecordingState:
          type: string
          description: 云端录像实际状态：disabled 关闭、starting 启动中、recording 录像中、waiting 等待、stopping 停止中、failed 失败；历史记录缺失时可能为空字符串。
          example: disabled
        cloudRecordingError:
          type: string
          description: 最近一次云端录像错误说明；没有记录时为空字符串。
          example: ""
        cloudRecordingUpdatedAt:
          type: string
          description: 云端录像运行状态最近更新时间。 未知或尚未发生时返回 null。
          example: null
          format: date-time
          nullable: true
        snapshotAt:
          type: string
          description: 平台最近一次成功抓拍该通道的时间；图片内容需通过具备权限的抓图接口获取。 未知或尚未发生时返回 null。
          example: null
          format: date-time
          nullable: true
        createdAt:
          type: string
          description: 平台通道记录创建时间。 未知或尚未发生时返回 null。
          example: 2026-11-01T08:00:00Z
          format: date-time
          nullable: true
        updatedAt:
          type: string
          description: 平台通道记录最近更新时间。 未知或尚未发生时返回 null。
          example: 2026-11-09T08:05:00Z
          format: date-time
          nullable: true
      example:
        deviceId: "34020000002000000001"
        channelId: "34020000001320000001"
        name: 门店入口
        alias: 一楼门店
        manufacturer: 示例厂商
        model: IPC-28181
        status: online
        ptzType: 1
        owner: 门店
        civilCode: "340200"
        parentId: "34020000002000000001"
        roomType: 2
        supplyLightType: 2
        directionType: 0
        resolution: 1920*1080
        positionType: 0
        useType: 1
        photoelectricImagingType: "1"
        capturePositionType: "1"
        streamNumberList: 0/1
        ipAddress: 192.0.2.20
        port: 0
        longitude: 118.38
        latitude: 31.33
        positionSource: catalog
        positionUpdatedAt: 2026-11-09T08:05:00Z
        statusEvent: ""
        streamId: ""
        onDemandLive: true
        streamTransport: TCP-Passive
        audioEnabled: true
        recordingMode: off
        cloudRecordingEnabled: false
        cloudRecordingState: disabled
        cloudRecordingError: ""
        cloudRecordingUpdatedAt: null
        snapshotAt: null
        createdAt: 2026-11-01T08:00:00Z
        updatedAt: 2026-11-09T08:05:00Z
    ChannelPage:
      type: object
      additionalProperties: false
      required:
        - items
        - page
        - pageSize
        - total
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Channel"
          description: 本页结果；没有记录时返回空数组。
        page:
          type: integer
          minimum: 1
          description: 当前页码，从 1 开始。
