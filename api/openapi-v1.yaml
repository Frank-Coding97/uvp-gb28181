components:
  securitySchemes:
    uvpHmac:
      type: apiKey
      in: header
      name: X-UVP-Signature
      description: HMAC-SHA256 signature produced with the server-side secret key.
  parameters:
    SignVersion:
      name: X-UVP-Sign-Version
      in: header
      required: true
      description: Signature version. Only v1 is accepted.
      schema:
        type: string
        enum:
          - "1"
    AccessKey:
      name: X-UVP-Access-Key
      in: header
      required: true
      description: Public access key; the matching secret key remains server-side.
      schema:
        type: string
        pattern: ^uvp_[0-9a-f]{32}$
    Timestamp:
      name: X-UVP-Timestamp
      in: header
      required: true
      description: Unix timestamp in seconds, decimal without leading zero, at most 19 digits and no greater than 9223372036854775807.
      schema:
        type: string
        pattern: ^(0|[1-9][0-9]{0,18})$
    Nonce:
      name: X-UVP-Nonce
      in: header
      required: true
      description: Single-use request nonce; duplicate and comma-joined values are rejected.
      schema:
        type: string
        pattern: ^[0-9a-f]{32}$
    Signature:
      name: X-UVP-Signature
      in: header
      required: true
      description: Lowercase hexadecimal HMAC-SHA256 signature over the canonical request.
      schema:
        type: string
        pattern: ^[0-9a-f]{64}$
    DeviceId:
      name: deviceId
      in: query
      required: true
      schema:
        type: string
        pattern: ^[0-9]{20}$
      description: 设备国标编码，20 位数字字符串。
      example: "34020000002000000001"
    ChannelId:
      name: channelId
      in: query
      required: true
      schema:
        type: string
        pattern: ^[0-9]{20}$
      description: 通道国标编码，20 位数字字符串；必须属于 deviceId 指定设备。
      example: "34020000001320000001"
    SessionId:
      name: sessionId
      in: query
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 64
      description: 启动接口返回的会话标识。
      example: 123e4567-e89b-42d3-a456-426614174000
    SnapshotId:
      name: snapshotId
      in: query
      required: true
      description: Image-library primary key returned by the snapshot-library listing; it is a database identifier, not a GB/T 28181 code.
      schema:
        type: string
        pattern: ^[1-9][0-9]{0,19}$
      example: "1"
    FileName:
      name: fileName
      in: query
      required: true
      description: Image file name exactly as reported by the device, without any directory part.
      schema:
        type: string
        pattern: ^[A-Za-z0-9._-]{1,64}$
      example: snapshot-001.jpg
    TrackId:
      name: trackId
      in: query
      required: true
      schema:
        type: integer
        minimum: 0
        maximum: 255
      description: 巡航轨迹编号，取值 0 至 255。
      example: 1
    PresetId:
      name: presetId
      in: query
      required: true
      schema:
        type: string
        pattern: ^[0-9]{1,3}$
      description: 预置位编号，取值 1 至 255。
      example: "1"
    OperationId:
      name: operationId
      in: query
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 64
      description: 异步操作接口返回的 operationId。
      example: operation-example-01
    SubscriptionId:
      name: subscriptionId
      in: query
      required: true
      schema:
        type: string
        pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
      description: 创建订阅接口返回的订阅标识。
      example: 123e4567-e89b-42d3-a456-426614174000
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Stable printable key used to make one PTZ command idempotent.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    Page:
      name: page
      in: query
      required: false
      description: Positive one-based page number; defaults to 1 when omitted; an explicit empty value is rejected.
      schema:
        type: integer
        format: int32
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      required: false
      description: Positive page size, at most 100; defaults to 20 when omitted; an explicit empty value is rejected.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor returned by the previous page; omit it to start from the beginning.
      schema:
        type: string
        maxLength: 256
    Keyword:
      name: keyword
      in: query
      required: false
      description: Valid UTF-8 search text, limited to 100 Unicode characters; an empty value is valid.
      schema:
        type: string
        maxLength: 100
    Status:
      name: status
      in: query
      required: false
      description: Optional device or channel status filter; an explicit empty value is rejected.
      schema:
        type: string
        enum:
          - online
          - offline
          - unknown
    From:
      name: from
      in: query
      required: false
      description: Inclusive lower bound on the capture time, RFC3339 with an explicit offset; an explicit empty value is rejected.
      schema:
        type: string
        format: date-time
    To:
      name: to
      in: query
      required: false
      description: Inclusive upper bound on the capture time, RFC3339 with an explicit offset; must not precede `from`; an explicit empty value is
        rejected.
      schema:
        type: string
        format: date-time
    Source:
      name: source
      in: query
      required: false
      description: Optional capture source filter; an explicit empty value is rejected.
      schema:
        type: string
        enum:
          - device
          - zlm
          - browser
  schemas:
    EmptyObject:
      type: object
      additionalProperties: false
    DeviceConfigRefreshRequest:
      type: object
      additionalProperties: false
      properties:
        configTypes:
          type: array
          minItems: 1
          maxItems: 9
          uniqueItems: true
          description: Omit to query profile-specific defaults; GB/T 28181-2016 defaults to BasicParam, while 2022 defaults to implemented
            channel-level types. Request BasicParam separately on 2022 devices.
          items:
            type: string
            enum:
              - BasicParam
              - VideoParamOpt
              - VideoRecordPlan
              - VideoAlarmRecord
              - PictureMask
              - FrameMirror
              - AlarmReport
              - OSDConfig
              - SnapShotConfig
    DeviceConfigApplyRequest:
      type: object
      additionalProperties: false
      required:
        - blocks
      properties:
        blocks:
          $ref: "#/components/schemas/DeviceConfigBlocksRequest"
    DeviceConfigBlocksRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      description: Only writable configuration blocks are accepted. VideoParamOpt is read-only; snapShot is managed by the capture-session API.
      properties:
        basicParam:
          $ref: "#/components/schemas/BasicParamWriteBlock"
        videoRecordPlan:
          $ref: "#/components/schemas/VideoRecordPlanWriteBlock"
        videoAlarmRecord:
          $ref: "#/components/schemas/VideoAlarmRecordWriteBlock"
        pictureMask:
          $ref: "#/components/schemas/PictureMaskWriteBlock"
        frameMirror:
          $ref: "#/components/schemas/FrameMirrorWriteBlock"
        alarmReport:
          $ref: "#/components/schemas/AlarmReportWriteBlock"
        osdConfig:
          $ref: "#/components/schemas/OSDConfigWriteBlock"
    BasicParamWriteBlock:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          description: 设备上报的名称。
        expiration:
          type: integer
          minimum: 1
          maximum: 86400
          description: 注册有效期，单位秒。
        heartBeatInterval:
          type: integer
          minimum: 1
          maximum: 86400
