                type: string
                description: 设备国标编码
                pattern: ^[0-9]{20}$
                example: "34020000002000000001"
              channelId:
                type: string
                description: 通道国标编码
                pattern: ^[0-9]{20}$
                example: "34020000001320000001"
              status:
                type: string
                description: 媒体会话当前状态
              mode:
                type: string
                description: 会话用途
                enum:
