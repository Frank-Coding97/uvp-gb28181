      responses:
        '200':
          description: "删除结果"
          headers: *noStoreHeader
          content:
            application/json:
              schema: {type: object, required: [code, message, requestId, data], properties: {code: {type: string, enum: [OK]}, message: {type: string, enum: [success]}, requestId: {type: string}, data: {$ref: '#/components/schemas/OpenAPISnapshotLibraryDeleteResponse'}}}
        '400': *invalidRequestResponse
        '401': *authenticationFailedResponse
        '403': *capabilityDeniedResponse
        '404': *resourceNotFoundResponse
        '405': *methodNotAllowedResponse
        '429': *rateLimitedResponse
        '503': *serviceUnavailableResponse
