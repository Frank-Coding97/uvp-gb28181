  /openapi/v1/snapshot/start:
    post:
      operationId: createChannelSnapshotSession
      summary: 设备抓图
      description: 向 GB/T 28181-2022 设备下发抓拍配置并创建抓图会话。图像由设备经 SIP 异步回传， 平台只保证会话已受理与命令下发状态，因此必须按 sessionId 轮询结果。 同一 Idempotency-Key 重放返回同一会话；相同 key
        携带不同参数按冲突处理。 2016 版设备不支持该命令，直接返回 CAPABILITY_NOT_SUPPORTED。
      x-uvp-scope: channel:snapshot:create
      x-uvp-risk: control
      x-uvp-idempotency-mode: required
      x-uvp-protocol-versions:
        - "2022"
      x-uvp-standard-refs:
        - GB/T 28181-2022 附录 A.2.3.2.12（SnapShotConfig）
        - GB/T 28181-2022 附录 A.2.5.7（图像抓拍传输完成通知）
      x-uvp-requires-confirmation: false
      x-uvp-enabled: true
      x-uvp-content-type: application/json
      x-uvp-idempotency-header: Idempotency-Key
      security:
        - uvpHmac: []
      parameters:
        - $ref: "#/components/parameters/SignVersion"
        - $ref: "#/components/parameters/AccessKey"
        - $ref: "#/components/parameters/Timestamp"
        - $ref: "#/components/parameters/Nonce"
        - $ref: "#/components/parameters/Signature"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActionCreateChannelSnapshotSessionRequest"
            example:
              deviceId: "34020000002000000001"
              channelId: "34020000001320000001"
              snapNum: 1
              interval: 1
      responses:
        "200":
          description: 抓图会话已受理
          headers: &a162
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - code
                  - message
                  - requestId
                  - data
                properties:
                  code:
                    type: string
                    enum:
                      - OK
                    description: 成功结果码。
                  message:
                    type: string
                    enum:
                      - success
                    description: 成功说明。
                  requestId:
                    type: string
                    description: 请求追踪标识。
                  data:
                    type: object
                    description: 设备抓图会话与 SnapShotConfig 命令的真实确认事实
                    additionalProperties: false
                    required:
                      - sessionId
                      - deviceId
                      - channelId
                      - state
                      - operationId
                      - commandStatus
                      - commandSipStatus
                      - commandResult
                      - commandResponseAt
                      - commandCompletedAt
                      - snapNum
                      - interval
                      - receivedCount
                      - notifiedCount
                      - images
                      - createdAt
                      - updatedAt
                    properties:
                      sessionId:
                        type: string
                        description: 平台抓图会话标识
                      deviceId:
                        type: string
                        description: 设备国标编码
                        pattern: ^[0-9]{20}$
                        example: "34020000002000000001"
                      channelId:
                        type: string
                        description: 通道国标编码
                        pattern: ^[0-9]{20}$
                        example: "34020000001320000001"
                      state:
                        type: string
                        description: 抓图接收状态；进程重启导致内存状态不可知时为 unknown
                      operationId:
                        type: string
                        description: 本次 SnapShotConfig 控制操作标识
                      commandStatus:
                        type: string
                        description: 控制命令当前状态；原操作不存在时为 unknown
                      commandSipStatus:
                        type: integer
                        description: 最近一次命令 SIP 响应码；尚未收到时为 0
                        minimum: 0
                      commandResult:
                        type: string
                        description: 设备对命令的业务响应；尚未收到时为空
                      commandResponseAt:
                        type: string
                        format: date-time
                        description: 设备业务响应到达时间；尚未收到为 null
                        nullable: true
                      commandCompletedAt:
                        type: string
                        format: date-time
                        description: 命令最终完成时间；未完成为 null
                        nullable: true
                      snapNum:
                        type: integer
                        description: 请求抓图张数
                        minimum: 1
                        maximum: 10
                      interval:
                        type: integer
                        description: 请求抓图间隔，单位秒
                        minimum: 1
                      receivedCount:
                        type: integer
                        description: 已接收的图片数量
                        minimum: 0
                      notifiedCount:
                        type: integer
                        description: 设备已通知的图片数量
                        minimum: 0
                      images:
                        type: array
                        description: 已持久化的图片列表
                        items:
                          type: object
                          description: 设备抓图会话中已持久化的图片
                          additionalProperties: false
                          required:
                            - fileName
                            - size
                            - md5
                            - capturedAt
                            - contentUrl
                          properties:
                            fileName:
                              type: string
                              description: 图片文件名，不含目录
                            size:
                              type: integer
                              description: 图片大小，单位字节
                              format: int64
                              minimum: 0
                            md5:
                              type: string
                              description: 文件 MD5
                            capturedAt:
                              type: string
                              format: date-time
                              description: 图片抓拍时间
                            contentUrl:
                              type: string
                              description: 读取图片内容的签名 GET 路径；需对完整查询串重新签名
                      createdAt:
                        type: string
                        format: date-time
                        description: 会话创建时间
                      updatedAt:
                        type: string
                        format: date-time
                        description: 会话最近更新时间
              example:
                code: OK
                message: success
                requestId: req_20261109_001
                data:
                  sessionId: 92352607-43db-4f2c-a82e-c863e03c4128
                  deviceId: "34020000002000000001"
                  channelId: "34020000001320000001"
                  state: waiting
                  operationId: 86ea0367-92e9-4dc4-aa91-6a338c353340
                  commandStatus: queued
                  commandSipStatus: 0
                  commandResult: OK
                  commandResponseAt: null
                  commandCompletedAt: null
                  snapNum: 1
                  interval: 1
                  receivedCount: 0
                  notifiedCount: 0
                  images: []
                  createdAt: 2026-11-09T08:00:00+08:00
                  updatedAt: 2026-11-09T08:00:00+08:00
        "400":
          description: Invalid request
          headers: *a162
          content: &a163
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication failed (AUTHENTICATION_FAILED), expired (REQUEST_EXPIRED), or replayed (REQUEST_REPLAYED).
          headers: *a162
          content: *a163
        "403":
