        required: true
        content:
          application/json:
            schema: {type: object, required: [snapNum, interval], additionalProperties: false, properties: {snapNum: {type: integer, minimum: 1, maximum: 10}, interval: {type: integer, minimum: 1, maximum: 3600}}}
      responses:
        '200':
          description: "抓图会话已受理"
