        按图像库主键读取该通道一张抓拍图的字节。字节以 base64 放入 JSON 信封，读取时校验
        落盘大小与 MD5 摘要；文件缺失或摘要不符按未找到处理，超过 8MiB 的异常库行同样按取不到处理。
      x-uvp-scope: channel:snapshot:library:image:read
