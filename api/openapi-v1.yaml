            description: 设备返回并由平台校验过的录像片段
            additionalProperties: false
            required:
              - recordKey
              - deviceId
              - channelId
              - startTime
              - endTime
              - secrecy
            properties:
              recordKey:
                type: string
                description: 当前客户端专属的短期录像键，用于启动回放或下载
              deviceId:
                type: string
                description: 设备国标编码
                pattern: ^[0-9]{20}$
                example: "34020000002000000001"
              channelId:
                type: string
                description: 通道国标编码
                pattern: ^[0-9]{20}$
                example: "34020000001320000001"
              name:
                type: string
                description: 设备报告的录像名称；未报告时省略
              startTime:
                type: string
                format: date-time
                description: 录像片段开始时间
              endTime:
                type: string
                format: date-time
                description: 录像片段结束时间
              secrecy:
                type: integer
                description: 保密属性
                enum:
                  - 0
                  - 1
              type:
                type: string
                description: 设备报告的录像类型；未报告时省略
              recorderId:
                type: string
                description: 设备报告的录像记录者编码；未报告时省略
              fileSize:
                type: integer
                description: 设备报告的录像大小，单位字节；未报告时省略
                format: int64
                minimum: 0
        totalRecords:
          type: integer
          description: 过滤后可分页的录像条目总数
          minimum: 0
        pageSize:
          type: integer
          description: 当前游标固定页大小
          minimum: 1
        nextCursor:
          type: string
          description: 继续分页的短期游标；没有下一页时省略
        protocolVersion:
          type: string
          description: 本次查询实际使用的国标版本
          enum:
            - "2016"
            - "2022"
        status:
          type: string
          description: 设备多响应查询的聚合状态
        incomplete:
          type: boolean
          description: 是否未完整收到设备声明的全部查询结果
        declaredTotal:
          type: integer
          description: 设备在 RecordInfo 中声明的录像总数
          minimum: 0
        receivedCount:
          type: integer
          description: 平台校验并过滤后保留的有效录像条目数
