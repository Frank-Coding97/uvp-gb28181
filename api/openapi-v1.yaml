    DeviceSubscription:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          description: 当前客户端逻辑订阅ID
        deviceId:
          type: string
          description: 设备国标编码
        kind:
          type: string
          description: 逻辑事件种类
          enum:
            - alarm
            - device_status
            - mobile_position
        enabled:
          type: boolean
          description: 当前客户端逻辑订阅是否启用
        status:
          type: string
          description: 当前客户端逻辑订阅状态，不代表上游SIP健康状态
          enum:
            - enabled
            - cancelled
            - expired
        expiresAt:
          type: string
          description: 当前客户端逻辑订阅到期时间
          format: date-time
        expiresSeconds:
          type: integer
          description: 当前客户端逻辑订阅有效期秒数
          minimum: 60
          maximum: 604800
        createdAt:
          type: string
          description: 逻辑订阅创建时间
          format: date-time
        updatedAt:
          type: string
          description: 逻辑订阅最近更新时间
          format: date-time
        upstream:
          type: object
          additionalProperties: false
          properties:
            enabled:
              type: boolean
              description: 平台共享SIP订阅是否启用；取消本客户端逻辑订阅不会把此值设为false
            status:
              type: string
              description: 共享SIP订阅持久化状态，不等于当前客户端逻辑订阅状态
              enum:
                - disabled
                - pending
                - active
                - degraded
                - expired
            expiresSeconds:
              type: integer
              description: 共享SIP订阅配置的有效期秒数；不等于当前客户端逻辑订阅期限
            intervalSeconds:
              type: integer
              description: 共享SIP订阅当前上报间隔秒数；不表示某客户端请求的间隔
            expiresAt:
              type: string
              description: 共享SIP会话到期时间，尚未确认为空
              format: date-time
              nullable: true
            lastSubscribeAt:
              type: string
              description: 最后一次发送SIP订阅的时间，尚未发送为空
              format: date-time
              nullable: true
            lastNotifyAt:
              type: string
              description: 最后一次收到共享订阅通知时间，尚未收到为空
              format: date-time
              nullable: true
            retryCount:
              type: integer
              description: 共享SIP订阅当前重试次数
              minimum: 0
            lastStatusCode:
              type: integer
              description: 最后SIP响应状态码，尚无响应为0
            lastError:
              type: string
              description: 共享订阅持久化的最近错误；无错误为空字符串
          required:
            - enabled
            - status
            - expiresSeconds
            - intervalSeconds
            - expiresAt
            - lastSubscribeAt
            - lastNotifyAt
            - retryCount
            - lastStatusCode
            - lastError
          nullable: true
          description: 共享设备级SIP订阅的真实配置和健康状态；不是当前客户端独占资源。device_status为平台逻辑事件，此项为空；共享行尚不存在时也为空。
