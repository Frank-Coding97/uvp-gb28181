openapi: 3.0.3
info:
  title: UVP machine-client API
  version: 1.0.0
  description: >-
    Server-to-server machine-client boundary. The access key identifies a
    client and the server resolves its owner and enabled scopes. The external
    business API never returns SK; controlled administrative creation or
    rotation displays it once for secure server-side delivery.
servers:
  - url: /
x-uvp-secret-handling: >-
  The external business API never returns SK. The controlled administrative
  create or rotate response is the sole one-time display for secure delivery;
  the receiving backend must store it server-side. Never embed SK in a browser,
  frontend, mobile app, or browser persistent storage.
x-uvp-signature-contract:
  algorithm: HMAC-SHA256
  requiredHeaders:
    - X-UVP-Sign-Version
    - X-UVP-Access-Key
    - X-UVP-Timestamp
    - X-UVP-Nonce
    - X-UVP-Signature
  queryAllowlist:
    - cursor
    - keyword
    - page
    - pageSize
    - status
  pathRule: ASCII literal paths only; encoded paths and ambiguous percent escapes are rejected.
  queryRule: Parse key=value pairs, reject raw +, duplicate or empty keys, missing equals, semicolons, and invalid percent escapes; spaces must be encoded as %20 and remain valid; decode once, RFC3986-encode, then sort.
  duplicateRule: Duplicate headers or query keys and comma-joined header values are rejected; leading/trailing whitespace is rejected only in headers.
  utf8Rule: Query and JSON strings must be valid UTF-8; invalid UTF-8 is rejected.
  canonical:
    lineSeparator: LF
    finalLineHasNoLF: true
    lines:
      - 'UVP-HMAC-SHA256/1'
      - '<AK>'
      - '<Timestamp>'
      - '<Nonce>'
      - '<UPPERCASE HTTP Method>'
      - '<CanonicalPath>'
      - '<CanonicalQuery, possibly empty>'
      - '<ContentType: application/json or empty>'
      - '<BodySHA256, lowercase hexadecimal>'
      - '<Idempotency-Key, or empty>'
      - '<ServiceAudience, deployment-fixed OpenAPI audience>'
    hmacKey: Decode the base64url-without-padding SK to 32 bytes before HMAC; never use the displayed SK text bytes.
    audience:
      source: deployment-fixed
      clientSupplied: false
    timestamp:
      maxSkewSeconds: 300
      rule: absolute difference from server time must be at most maxSkewSeconds
    nonce:
      minimumRetentionSeconds: 660
      uniqueBy: (client_id, nonce)
      persistent: true
      survivesSecretRotation: true
x-uvp-retry-policy:
  GET: Retry only with a fresh timestamp, nonce, and signature.
  POST: Do not automatically retry after a timeout; callers must decide whether to retry.
x-uvp-transport-contract:
  httpVersion: HTTP/1.1
  tls:
    required: false
    description: Transport security is deployment-controlled; the OpenAPI application layer does not reject HTTP.
  post:
    body:
      contentLength:
        required: false
        description: Playback start uses an empty body; JSON commands remain required.
        minimum: 0
        maximum: 65536
        value: exact body byte length
        signed: false
      transferEncoding:
        allowed: false
        chunked: false
      contentEncoding:
        allowed: false
      contentType: application/json
      json:
        exactFields: [protocol]
        rejectUnknownFields: true
        rejectDuplicateFields: true
    automaticRetry: false
x-uvp-error-classification:
  missingRequiredAuthHeader: 401
  malformedAuthHeader: 400
  unknownInactiveOrInvalidHMAC: 401
  expired: 401
  replayed: 401
  dependencyUnavailable: 503
x-uvp-request-limits:
  bodyBytes: 65536
  queryBytes: 8192
  bodyHash: Hash the original request bytes; do not reserialize JSON before signing.
  duplicateJsonMembers: Reject duplicate JSON object member names.
security:
  - uvpHmac: []
paths:
  /openapi/v1/devices:
    get:
      operationId: listDevices
      summary: List devices owned by the authenticated machine client
      x-uvp-scope: device:list
      x-uvp-risk: read
      x-uvp-idempotency-mode: none
      x-uvp-enabled: true
      security:
        - uvpHmac: []
      parameters:
        - $ref: '#/components/parameters/SignVersion'
        - $ref: '#/components/parameters/AccessKey'
        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/Nonce'
        - $ref: '#/components/parameters/Signature'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Keyword'
        - $ref: '#/components/parameters/Status'
      responses:
        '200':
          description: Device list
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceListResponse'
        '400': &invalidRequestResponse
          description: Invalid request
          headers: &noStoreHeader
            Cache-Control:
              required: true
              schema:
                type: string
                enum: [no-store]
          content: &errorContent
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401': &authenticationFailedResponse
          description: Authentication failed (AUTHENTICATION_FAILED), expired (REQUEST_EXPIRED), or replayed (REQUEST_REPLAYED).
          headers: *noStoreHeader
          content: *errorContent
        '403': &capabilityDeniedResponse
          description: Capability denied
          headers: *noStoreHeader
          content: *errorContent
        '422': &capabilityNotSupportedResponse
          description: Device or protocol capability is not supported
          headers: *noStoreHeader
          content: *errorContent
        '404': &resourceNotFoundResponse
          description: Resource not found
          headers: *noStoreHeader
          content: *errorContent
        '405': &methodNotAllowedResponse
          description: Method not allowed; an HTTP HEAD response has no body.
          headers: *noStoreHeader
        '429': &rateLimitedResponse
          description: Rate limited or quota exceeded
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum: [no-store]
            Retry-After:
              required: true
              schema:
                type: integer
                minimum: 1
          content: *errorContent
        '503': &serviceUnavailableResponse
          description: Service unavailable
          headers: *noStoreHeader
          content: *errorContent
  /openapi/v1/devices/{deviceId}:
    get:
      operationId: getDevice
      summary: Get one device owned by the authenticated machine client
      x-uvp-scope: device:detail
      x-uvp-risk: read
      x-uvp-idempotency-mode: none
      x-uvp-enabled: true
      security:
        - uvpHmac: []
      parameters:
        - $ref: '#/components/parameters/SignVersion'
        - $ref: '#/components/parameters/AccessKey'
        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/Nonce'
        - $ref: '#/components/parameters/Signature'
        - $ref: '#/components/parameters/DeviceId'
      responses:
        '200':
          description: Device
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceResponse'
        '400': *invalidRequestResponse
        '401': *authenticationFailedResponse
        '403': *capabilityDeniedResponse
        '404': *resourceNotFoundResponse
        '405': *methodNotAllowedResponse
        '429': *rateLimitedResponse
        '503': *serviceUnavailableResponse
  /openapi/v1/devices/{deviceId}/status:
    get:
      operationId: getDeviceStatus
      summary: Get the status of one owned device
      x-uvp-scope: device:status
      x-uvp-risk: read
      x-uvp-idempotency-mode: none
      x-uvp-enabled: true
      security:
        - uvpHmac: []
      parameters:
        - $ref: '#/components/parameters/SignVersion'
        - $ref: '#/components/parameters/AccessKey'
        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/Nonce'
        - $ref: '#/components/parameters/Signature'
        - $ref: '#/components/parameters/DeviceId'
      responses:
        '200':
          description: Device status
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceStatusResponse'
        '400': *invalidRequestResponse
        '401': *authenticationFailedResponse
        '403': *capabilityDeniedResponse
        '404': *resourceNotFoundResponse
        '405': *methodNotAllowedResponse
        '429': *rateLimitedResponse
        '503': *serviceUnavailableResponse
  /openapi/v1/devices/{deviceId}/channels:
    get:
      operationId: listChannels
      summary: List channels of one owned device
      x-uvp-scope: channel:list
      x-uvp-risk: read
      x-uvp-idempotency-mode: none
      x-uvp-enabled: true
      security:
        - uvpHmac: []
      parameters:
        - $ref: '#/components/parameters/SignVersion'
        - $ref: '#/components/parameters/AccessKey'
        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/Nonce'
        - $ref: '#/components/parameters/Signature'
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Keyword'
        - $ref: '#/components/parameters/Status'
      responses:
        '200':
          description: Channel list
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelListResponse'
        '400': *invalidRequestResponse
        '401': *authenticationFailedResponse
        '403': *capabilityDeniedResponse
        '404': *resourceNotFoundResponse
        '405': *methodNotAllowedResponse
        '429': *rateLimitedResponse
        '503': *serviceUnavailableResponse
  /openapi/v1/devices/{deviceId}/channels/{channelId}:
    get:
      operationId: getChannel
      summary: Get one channel of one owned device
      x-uvp-scope: channel:detail
      x-uvp-risk: read
      x-uvp-idempotency-mode: none
      x-uvp-enabled: true
      security:
        - uvpHmac: []
      parameters:
        - $ref: '#/components/parameters/SignVersion'
        - $ref: '#/components/parameters/AccessKey'
        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/Nonce'
        - $ref: '#/components/parameters/Signature'
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/ChannelId'
      responses:
        '200':
          description: Channel
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelResponse'
        '400': *invalidRequestResponse
        '401': *authenticationFailedResponse
        '403': *capabilityDeniedResponse
        '404': *resourceNotFoundResponse
        '405': *methodNotAllowedResponse
        '429': *rateLimitedResponse
        '503': *serviceUnavailableResponse
  /openapi/v1/devices/{deviceId}/channels/{channelId}/status:
