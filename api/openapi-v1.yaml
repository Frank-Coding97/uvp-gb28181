                  description: 协议对应的播放地址
              hasAudio:
                type: boolean
                description: 媒体流是否包含音频
              startTime:
                type: string
                format: date-time
                description: 所选录像片段开始时间
              endTime:
                type: string
                format: date-time
                description: 所选录像片段结束时间
              playFrom:
                type: string
                format: date-time
                description: 本次请求的起播时间
              positionSeconds:
                type: number
                description: 相对录像片段开始时刻的播放位置，单位秒
              scale:
                type: number
                description: 当前播放倍率
              createdAt:
                type: string
                format: date-time
                description: 平台创建会话时间
              deadline:
                type: string
                format: date-time
                description: 会话绝对存活截止时间
              existing:
                type: boolean
                description: 本次启动是否复用了同一客户端的幂等会话；查询接口固定为 false
              recordKey:
                type: string
                description: 录像检索返回的当前客户端专属短期录像键
              streamId:
                type: string
                description: 平台媒体流标识；建立流之前可为空
              ssrc:
                type: string
                description: 本会话媒体流 SSRC
              downloadSpeed:
                type: integer
                description: 设备下载速率倍率；回放模式通常为 0
