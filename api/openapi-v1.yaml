    OpenAPISnapshotSession:
      type: object
      description: 设备抓图会话与 SnapShotConfig 命令的真实确认事实
      additionalProperties: false
      required:
        - sessionId
        - deviceId
        - channelId
        - state
        - operationId
        - commandStatus
        - commandSipStatus
        - commandResult
        - commandResponseAt
        - commandCompletedAt
        - snapNum
        - interval
        - receivedCount
        - notifiedCount
        - images
        - createdAt
        - updatedAt
      properties:
        sessionId:
          type: string
          description: 平台抓图会话标识
        deviceId:
          type: string
          description: 设备国标编码
          pattern: ^[0-9]{20}$
          example: "34020000002000000001"
        channelId:
          type: string
          description: 通道国标编码
          pattern: ^[0-9]{20}$
          example: "34020000001320000001"
        state:
          type: string
          description: 抓图接收状态；进程重启导致内存状态不可知时为 unknown
        operationId:
          type: string
          description: 本次 SnapShotConfig 控制操作标识
        commandStatus:
          type: string
          description: 控制命令当前状态；原操作不存在时为 unknown
        commandSipStatus:
          type: integer
          description: 最近一次命令 SIP 响应码；尚未收到时为 0
          minimum: 0
        commandResult:
          type: string
          description: 设备对命令的业务响应；尚未收到时为空
        commandResponseAt:
          type: string
          format: date-time
          description: 设备业务响应到达时间；尚未收到为 null
          nullable: true
        commandCompletedAt:
          type: string
          format: date-time
          description: 命令最终完成时间；未完成为 null
          nullable: true
        snapNum:
          type: integer
          description: 请求抓图张数
          minimum: 1
          maximum: 10
        interval:
          type: integer
          description: 请求抓图间隔，单位秒
          minimum: 1
        receivedCount:
          type: integer
          description: 已接收的图片数量
          minimum: 0
        notifiedCount:
          type: integer
          description: 设备已通知的图片数量
          minimum: 0
        images:
          type: array
          description: 已持久化的图片列表
          items:
            type: object
            description: 设备抓图会话中已持久化的图片
            additionalProperties: false
            required:
              - fileName
              - size
              - md5
              - capturedAt
              - contentUrl
            properties:
              fileName:
                type: string
                description: 图片文件名，不含目录
              size:
                type: integer
                description: 图片大小，单位字节
                format: int64
                minimum: 0
              md5:
                type: string
                description: 文件 MD5
              capturedAt:
                type: string
                format: date-time
                description: 图片抓拍时间
              contentUrl:
                type: string
                description: 读取图片内容的签名 GET 路径；需对完整查询串重新签名
        createdAt:
          type: string
          format: date-time
          description: 会话创建时间
        updatedAt:
          type: string
          format: date-time
          description: 会话最近更新时间
    OpenAPISnapshotImage:
      type: object
      description: 设备抓图会话中已持久化的图片
      additionalProperties: false
      required:
        - fileName
        - size
        - md5
        - capturedAt
        - contentUrl
      properties:
        fileName:
          type: string
          description: 图片文件名，不含目录
        size:
          type: integer
          description: 图片大小，单位字节
          format: int64
          minimum: 0
        md5:
