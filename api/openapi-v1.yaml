openapi: 3.0.3
info:
  title: UVP machine-client API
  version: 1.0.0
  description: Server-to-server machine-client boundary. The access key identifies a client and the server resolves its owner and enabled
    scopes. The external business API never returns SK; controlled administrative creation or rotation displays it once for secure
    server-side delivery.
servers:
  - url: /
x-uvp-secret-handling: The external business API never returns SK. The controlled administrative create or rotate response is the sole
  one-time display for secure delivery; the receiving backend must store it server-side. Never embed SK in a browser, frontend, mobile app,
  or browser persistent storage.
x-uvp-signature-contract:
  algorithm: HMAC-SHA256
  requiredHeaders:
    - X-UVP-Sign-Version
    - X-UVP-Access-Key
    - X-UVP-Timestamp
    - X-UVP-Nonce
    - X-UVP-Signature
  queryAllowlist:
    - alarmFrom
    - alarmId
    - alarmTo
    - alarmType
    - audioEnabled
    - channelId
    - cursor
    - deviceId
    - endDate
    - endTime
    - fileId
    - fileName
    - from
    - keyword
    - manufacturer
    - metadataState
    - method
    - model
    - operationId
    - order
    - page
    - pageSize
    - priority
    - protocolVersion
    - ptzType
    - sessionId
    - snapshotId
    - sort
    - source
    - sourceCode
    - startDate
    - startTime
    - status
    - streamTransport
    - subscriptionId
    - to
    - trackId
    - transport
  pathRule: ASCII literal paths only; encoded paths and ambiguous percent escapes are rejected.
  queryRule: Parse key=value pairs, reject raw +, duplicate or empty keys, missing equals, semicolons, and invalid percent escapes; spaces
    must be encoded as %20 and remain valid; decode once, RFC3986-encode, then sort.
  duplicateRule: Duplicate headers or query keys and comma-joined header values are rejected; leading/trailing whitespace is rejected only in headers.
  utf8Rule: Query and JSON strings must be valid UTF-8; invalid UTF-8 is rejected.
  canonical:
    lineSeparator: LF
    finalLineHasNoLF: true
    lines:
      - UVP-HMAC-SHA256/1
      - <AK>
      - <Timestamp>
      - <Nonce>
      - <UPPERCASE HTTP Method>
      - <CanonicalPath>
      - <CanonicalQuery, possibly empty>
      - "<ContentType: application/json or empty>"
      - <BodySHA256, lowercase hexadecimal>
      - <Idempotency-Key, or empty>
      - <ServiceAudience, deployment-fixed OpenAPI audience>
    hmacKey: Decode the base64url-without-padding SK to 32 bytes before HMAC; never use the displayed SK text bytes.
    audience:
      source: deployment-fixed
      clientSupplied: false
    timestamp:
      maxSkewSeconds: 300
      rule: absolute difference from server time must be at most maxSkewSeconds
    nonce:
      minimumRetentionSeconds: 660
      uniqueBy: (client_id, nonce)
      persistent: true
      survivesSecretRotation: true
  queryAllowlistRule: The list is the union of documented GET query fields. Each operation accepts only its declared parameters; POST uses
    JSON and accepts no query fields.
x-uvp-retry-policy:
  GET: Retry only with a fresh timestamp, nonce, and signature.
  POST: Do not automatically retry after a timeout; callers must decide whether to retry.
x-uvp-transport-contract:
  httpVersion: HTTP/1.1
  tls:
    required: false
    description: Transport security is deployment-controlled; the OpenAPI application layer does not reject HTTP.
  post:
    body:
      contentLength:
        required: false
        description: Every action POST requires a JSON object body containing the documented target identifiers and command fields.
        minimum: 2
        maximum: 65536
        value: exact body byte length
        signed: false
      transferEncoding:
        allowed: false
        chunked: false
      contentEncoding:
        allowed: false
      contentType: application/json
      json:
        rejectUnknownFields: true
        rejectDuplicateFields: true
        fieldRule: Use the request schema of the selected action; target identifiers and command fields are signed together as the original JSON
          bytes.
    automaticRetry: false
x-uvp-error-classification:
  missingRequiredAuthHeader: 401
  malformedAuthHeader: 400
  unknownInactiveOrInvalidHMAC: 401
  expired: 401
  replayed: 401
  dependencyUnavailable: 503
x-uvp-request-limits:
  bodyBytes: 65536
  queryBytes: 8192
  bodyHash: Hash the original request bytes; do not reserialize JSON before signing.
  duplicateJsonMembers: Reject duplicate JSON object member names.
