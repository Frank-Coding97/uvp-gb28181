      parameters:
        - $ref: '#/components/parameters/SignVersion'
        - $ref: '#/components/parameters/AccessKey'
        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/Nonce'
        - $ref: '#/components/parameters/Signature'
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/ChannelId'
      responses:
        '200':
          description: Channel status
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelStatusResponse'
        '400': *invalidRequestResponse
        '401': *authenticationFailedResponse
        '403': *capabilityDeniedResponse
        '404': *resourceNotFoundResponse
        '405': *methodNotAllowedResponse
        '429': *rateLimitedResponse
        '503': *serviceUnavailableResponse
  /openapi/v1/devices/{deviceId}/channels/{channelId}/control-capabilities:
    get:
      operationId: getChannelControlCapabilities
      summary: Get explicitly reported control capabilities for one owned channel
      description: Capability state is supported, unsupported, or unknown. Unknown means the device did not explicitly report the capability; it must not be treated as supported.
      x-uvp-scope: channel:capabilities
      x-uvp-risk: read
      x-uvp-idempotency-mode: none
      x-uvp-protocol-versions: ["2016", "2022"]
      x-uvp-standard-refs: ["平台基于设备上报能力的三态解析"]
      x-uvp-enabled: true
      security:
        - uvpHmac: []
      parameters:
        - $ref: '#/components/parameters/SignVersion'
        - $ref: '#/components/parameters/AccessKey'
        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/Nonce'
        - $ref: '#/components/parameters/Signature'
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/ChannelId'
      responses:
        '200':
          description: Three-state channel control capabilities
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlCapabilitiesResponse'
        '400': *invalidRequestResponse
        '401': *authenticationFailedResponse
        '403': *capabilityDeniedResponse
        '404': *resourceNotFoundResponse
        '405': *methodNotAllowedResponse
        '429': *rateLimitedResponse
        '503': *serviceUnavailableResponse
  /openapi/v1/devices/{deviceId}/channels/{channelId}/storage-cards:
    get:
      operationId: getChannelStorageCards
      summary: Read cached storage card status for one owned channel
      description: Reads the latest platform cache without sending a device command. freshness is unknown when no observation exists, fresh within one minute, and stale otherwise. observedAt is the most recent observation time; individual cards retain their own observation times.
      x-uvp-scope: channel:storage-cards
      x-uvp-risk: read
      x-uvp-idempotency-mode: none
      x-uvp-protocol-versions: ["2016", "2022"]
      x-uvp-standard-refs: ["平台缓存的设备存储状态；结果带 freshness/observedAt"]
      x-uvp-enabled: true
      security:
        - uvpHmac: []
      parameters:
        - $ref: '#/components/parameters/SignVersion'
        - $ref: '#/components/parameters/AccessKey'
        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/Nonce'
        - $ref: '#/components/parameters/Signature'
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/ChannelId'
      responses:
        '200':
          description: Cached storage card observations
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageCardSnapshotResponse'
        '400': *invalidRequestResponse
        '401': *authenticationFailedResponse
        '403': *capabilityDeniedResponse
        '404': *resourceNotFoundResponse
        '405': *methodNotAllowedResponse
        '429': *rateLimitedResponse
        '503': *serviceUnavailableResponse
  /openapi/v1/devices/{deviceId}/channels/{channelId}/live:
    post:
      operationId: startLivePlayback
      summary: Start or reuse live playback for one owned channel
      description: The platform reuses an existing live stream when available. This operation has no request body; fixed playback-address behavior remains governed by GB28181 service configuration.
      x-uvp-scope: play:live
      x-uvp-risk: control
      x-uvp-idempotency-mode: none
      x-uvp-protocol-versions: ["2016", "2022"]
      x-uvp-standard-refs: ["GB/T 28181-2016 9.2", "GB/T 28181-2022 9.2"]
      x-uvp-enabled: true
      x-uvp-body: empty
      security:
        - uvpHmac: []
      parameters:
        - $ref: '#/components/parameters/SignVersion'
        - $ref: '#/components/parameters/AccessKey'
        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/Nonce'
        - $ref: '#/components/parameters/Signature'
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/ChannelId'
      responses:
        '200':
          description: Live playback result
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LivePlaybackResponse'
        '400': *invalidRequestResponse
        '401': *authenticationFailedResponse
        '403': *capabilityDeniedResponse
        '404': *resourceNotFoundResponse
        '405': *methodNotAllowedResponse
        '409':
          description: Device or channel cannot accept playback
          headers: *noStoreHeader
          content: *errorContent
        '429': *rateLimitedResponse
        '503': *serviceUnavailableResponse
    delete:
      operationId: stopLivePlayback
      summary: Stop the live stream this client opened for one channel
      description: >-
        Ends the live media stream this client started for the channel and
        retires its viewer reservation. The platform serves one shared live
        stream per channel, so stopping it also interrupts every other viewer of
        that channel — they must start playback again to recover. A channel this
        client never started answers 404 instead of stopping another client's
        stream; the ledger, not the stream identifier, is the ownership evidence.
      x-uvp-scope: play:live:stop
      x-uvp-risk: media
      x-uvp-idempotency-mode: none
      x-uvp-protocol-versions: ["2016", "2022"]
      x-uvp-standard-refs: ["GB/T 28181-2016 9.2", "GB/T 28181-2022 9.2"]
      x-uvp-enabled: true
      security:
        - uvpHmac: []
      parameters:
        - $ref: '#/components/parameters/SignVersion'
        - $ref: '#/components/parameters/AccessKey'
        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/Nonce'
        - $ref: '#/components/parameters/Signature'
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/ChannelId'
      responses:
        '200':
          description: Live stream stop result
          headers: *noStoreHeader
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveStopPlaybackResponse'
        '400': *invalidRequestResponse
        '401': *authenticationFailedResponse
        '403': *capabilityDeniedResponse
        '404': *resourceNotFoundResponse
        '405': *methodNotAllowedResponse
        '429': *rateLimitedResponse
        '503': *serviceUnavailableResponse
  /openapi/v1/devices/{deviceId}/channels/{channelId}/ptz/presets:
    get:
      operationId: listPTZPresets
      summary: List PTZ presets for one owned channel
      x-uvp-scope: ptz:preset:list
      x-uvp-risk: read
      x-uvp-idempotency-mode: none
      x-uvp-protocol-versions: ["2016", "2022"]
      x-uvp-standard-refs: ["GB/T 28181-2016 A.2.4.8", "GB/T 28181-2022 A.2.4.8"]
      x-uvp-enabled: true
      security:
        - uvpHmac: []
      parameters:
        - $ref: '#/components/parameters/SignVersion'
        - $ref: '#/components/parameters/AccessKey'
        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/Nonce'
        - $ref: '#/components/parameters/Signature'
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/ChannelId'
      responses:
        '200':
          description: PTZ preset list
          headers: {Cache-Control: {required: true, schema: {type: string, enum: [no-store]}}}
          content: {application/json: {schema: {$ref: '#/components/schemas/PTZPresetListResponse'}}}
        '400': *invalidRequestResponse
        '401': *authenticationFailedResponse
        '403': *capabilityDeniedResponse
        '404': *resourceNotFoundResponse
        '405': *methodNotAllowedResponse
        '429': *rateLimitedResponse
        '503': *serviceUnavailableResponse
    post:
      operationId: savePTZPreset
      summary: Save a PTZ preset on one owned channel
      x-uvp-scope: ptz:preset:save
      x-uvp-risk: control
      x-uvp-idempotency-mode: required
      x-uvp-protocol-versions: ["2016", "2022"]
      x-uvp-standard-refs: ["GB/T 28181-2016 A.2.3.1.2", "GB/T 28181-2022 A.2.3.1.2"]
      x-uvp-enabled: true
      x-uvp-content-type: application/json
      x-uvp-idempotency-header: Idempotency-Key
      security:
        - uvpHmac: []
      parameters:
        - $ref: '#/components/parameters/SignVersion'
        - $ref: '#/components/parameters/AccessKey'
        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/Nonce'
        - $ref: '#/components/parameters/Signature'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/ChannelId'
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/PTZPresetRequest'}}}
      responses:
        '200':
          description: PTZ preset operation accepted
          headers: {Cache-Control: {required: true, schema: {type: string, enum: [no-store]}}}
          content: {application/json: {schema: {$ref: '#/components/schemas/PTZOperationResponse'}}}
        '400': *invalidRequestResponse
        '401': *authenticationFailedResponse
        '403': *capabilityDeniedResponse
        '404': *resourceNotFoundResponse
        '405': *methodNotAllowedResponse
        '409': &conflictResponse
          description: Idempotency key conflicts with a different PTZ command
          headers: *noStoreHeader
          content: *errorContent
        '429': *rateLimitedResponse
        '503': *serviceUnavailableResponse
  /openapi/v1/devices/{deviceId}/channels/{channelId}/ptz/presets/{presetId}/call:
    post:
      operationId: callPTZPreset
      summary: Call a PTZ preset on one owned channel
      x-uvp-scope: ptz:preset:call
      x-uvp-risk: control
      x-uvp-idempotency-mode: required
      x-uvp-protocol-versions: ["2016", "2022"]
      x-uvp-standard-refs: ["GB/T 28181-2016 A.2.3.1.2", "GB/T 28181-2022 A.2.3.1.2"]
      x-uvp-enabled: true
      x-uvp-content-type: application/json
      x-uvp-idempotency-header: Idempotency-Key
