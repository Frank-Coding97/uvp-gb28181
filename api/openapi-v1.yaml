            expiresAt:
              type: string
              description: 共享SIP会话到期时间，尚未确认为空
              format: date-time
              nullable: true
            lastSubscribeAt:
              type: string
              description: 最后一次发送SIP订阅的时间，尚未发送为空
              format: date-time
              nullable: true
            lastNotifyAt:
              type: string
              description: 最后一次收到共享订阅通知时间，尚未收到为空
              format: date-time
              nullable: true
