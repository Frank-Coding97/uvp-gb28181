  /openapi/v1/devices/{deviceId}/channels/{channelId}/snapshot-library:
    get:
      operationId: listChannelSnapshotLibrary
      summary: "通道抓拍图列表"
      description: >-
        分页列出该通道图像库中的抓拍图。图像库汇集设备回传（A.2.5.7）、媒体节点截帧
        与浏览器截图三类产出，本接口只返回元数据与取图地址，不内联图片字节。
        列表按拍摄时刻倒序；from/to 打在拍摄时刻而非平台接收时刻（设备补传时两者可能相差数小时）。
        设备离线不影响本接口。
      x-uvp-scope: channel:snapshot:library:read
      x-uvp-risk: read
      x-uvp-idempotency-mode: none
      x-uvp-protocol-versions: ["2016", "2022"]
      x-uvp-standard-refs: ["GB/T 28181-2022 附录 A.2.5.7（图像抓拍传输完成通知）", "平台图像库：设备抓拍、媒体节点截帧与浏览器截图汇总"]
      x-uvp-requires-confirmation: false
      x-uvp-enabled: true
      security:
        - uvpHmac: []
      parameters:
        - $ref: '#/components/parameters/SignVersion'
        - $ref: '#/components/parameters/AccessKey'
        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/Nonce'
