      x-uvp-protocol-versions: ["2016", "2022"]
      x-uvp-standard-refs: ["GB/T 28181-2022 附录 A.2.5.7（图像抓拍传输完成通知）", "平台图像库：设备抓拍、媒体节点截帧与浏览器截图汇总"]
      x-uvp-requires-confirmation: false
      x-uvp-enabled: true
      security:
