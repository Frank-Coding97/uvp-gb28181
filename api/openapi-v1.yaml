  /openapi/v1/devices/{deviceId}/channels/{channelId}/snapshot-sessions:
    post:
      operationId: createChannelSnapshotSession
      summary: "设备抓图"
      description: >-
        向 GB/T 28181-2022 设备下发抓拍配置并创建抓图会话。图像由设备经 SIP 异步回传，
        平台只保证会话已受理与命令下发状态，因此必须按 sessionId 轮询结果。
        同一 Idempotency-Key 重放返回同一会话；相同 key 携带不同参数按冲突处理。
        2016 版设备不支持该命令，直接返回 CAPABILITY_NOT_SUPPORTED。
      x-uvp-scope: channel:snapshot:create
      x-uvp-risk: control
      x-uvp-idempotency-mode: required
      x-uvp-protocol-versions: ["2022"]
      x-uvp-standard-refs: ["GB/T 28181-2022 附录 A.2.3.2.12（SnapShotConfig）", "GB/T 28181-2022 附录 A.2.5.7（图像抓拍传输完成通知）"]
      x-uvp-requires-confirmation: false
      x-uvp-enabled: true
      x-uvp-content-type: application/json
      x-uvp-idempotency-header: Idempotency-Key
