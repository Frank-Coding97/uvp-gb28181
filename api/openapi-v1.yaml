              playFrom:
                type: string
                format: date-time
                description: 本次请求的起播时间
              positionSeconds:
                type: number
                description: 相对录像片段开始时刻的播放位置，单位秒
              scale:
                type: number
                description: 当前播放倍率
              createdAt:
                type: string
                format: date-time
                description: 平台创建会话时间
              deadline:
                type: string
                format: date-time
                description: 会话绝对存活截止时间
              existing:
                type: boolean
                description: 本次启动是否复用了同一客户端的幂等会话；查询接口固定为 false
              recordKey:
                type: string
                description: 录像检索返回的当前客户端专属短期录像键
              streamId:
                type: string
                description: 平台媒体流标识；建立流之前可为空
              ssrc:
                type: string
                description: 本会话媒体流 SSRC
              downloadSpeed:
                type: integer
                description: 设备下载速率倍率；回放模式通常为 0
                minimum: 0
              defaultProtocol:
                type: string
                description: 平台配置的首选播放协议
              endReason:
                type: string
                description: 会话结束原因；未结束时为空
              errorCode:
                type: string
                description: 失败的稳定错误码；无错误时为空
              errorStage:
                type: string
                description: 失败发生的阶段；无错误时为空
              lastActivityAt:
                type: string
                format: date-time
                description: 会话最近一次有效活动时间
              idleDeadline:
                type: string
                format: date-time
                description: 无人续租时会话过期时间
        page:
          type: integer
          description: 当前页码
          minimum: 1
        pageSize:
          type: integer
          description: 每页条数
          minimum: 1
          maximum: 100
        total:
          type: integer
          description: 通过当前客户端、目标和设备代次校验的会话总数
