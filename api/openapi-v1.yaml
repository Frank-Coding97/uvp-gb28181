                type: string
                description: 平台配置的首选播放协议
              endReason:
                type: string
                description: 会话结束原因；未结束时为空
              errorCode:
                type: string
                description: 失败的稳定错误码；无错误时为空
              errorStage:
                type: string
                description: 失败发生的阶段；无错误时为空
              lastActivityAt:
                type: string
                format: date-time
                description: 会话最近一次有效活动时间
              idleDeadline:
                type: string
                format: date-time
                description: 无人续租时会话过期时间
        page:
          type: integer
          description: 当前页码
          minimum: 1
        pageSize:
          type: integer
          description: 每页条数
          minimum: 1
          maximum: 100
        total:
          type: integer
          description: 通过当前客户端、目标和设备代次校验的会话总数
          minimum: 0
