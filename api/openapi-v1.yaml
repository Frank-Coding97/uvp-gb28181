        - channelId
        - fileName
        - startTime
        - durationSeconds
        - sizeBytes
        - recordDate
        - source
        - metadataState
        - missing
        - discoveredAt
        - lastSeenAt
    CloudRecordDates:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          description: 有索引记录的日期升序集合，不含零记录日期
          items:
            type: object
            additionalProperties: false
            properties:
              date:
                type: string
                description: 录像索引日期
                format: date
              fileCount:
                type: integer
                description: 该日期可见的云录像索引条数；包含已标记缺失项
                minimum: 1
            required:
              - date
              - fileCount
        startDate:
          type: string
          description: 日期窗口开始（包含）
          format: date
        endDate:
          type: string
          description: 日期窗口结束（不包含）
          format: date
      required:
        - items
        - startDate
        - endDate
