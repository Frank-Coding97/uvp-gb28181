server:
  appdebug: true   # 调试模式开关：影响 gin Mode 和调试路由(swagger/pprof)；日志由 logs.level / logs.outputs 控制，与本开关无关
  cachetype: "redis" # 缓存模式 memory(单机/测试) OR redis(多实例必须)
  syslog: false  # 是否记录 HTTP 操作日志到数据库(全局操作日志中间件)；与 logs.* 文件日志无关
  notcheckuser: []    # 不检查权限的用户（api、菜单及数据权限均不检查），例如：[1]
  # 演示账号配置
  demoaccount:
    enabled: false    # 是否启用演示账号功能
    # 演示账号的用户ID列表，可以设置多个账号
    userids: []       # 演示账号的用户ID列表，例如：[1, 2, 3]
    defaultusername: "admin"  # 登录页默认账号
    defaultpassword: "123456"  # 登录页默认密码
    # 允许演示账号执行非GET请求的路径前缀列表（白名单）
    # 配置后，演示账号可以对这些路径执行POST/PUT/DELETE等操作
    # 示例：
    # allowpathprefixes:
    #   - "/api/demo/"          # 演示相关API
    #   - "/api/public/"        # 公开API
    #   - "/api/plugins/test/"  # 测试插件API
    allowpathprefixes: []

system: # 品牌信息：登录页与系统设置展示，由配置接口下发给前端
  #系统LOGO
  systemlogo: ""     # 留空则用内置默认图
  #系统图标
  systemicon: ""     # 浏览器页签 favicon
  #系统名称
  systemname: "UVP-GB28181"
  #版权声明
  systemcopyright: "Copyright © 2025 -2028  云南奇讯科技有限公司版权所有"
  #备案号
  systemrecordno: "滇ICP备16002997号"
safe:
  #密码错误锁定阈值(指定时间内连续登录失败次数达到该值将锁定账号,0表示不锁定)
  loginlockthreshold: 3
  #连续登录失败次数记录缓存时间(单位秒)
  loginlockexpire: 60
  #账号锁定时长(单位秒)
  loginlockduration: 600
  #密码最小长度
  minpasswordlength: 6
  #密码是否必须包含特殊字符
  requirespecialchar: true
captcha: # 登录验证码
  open : false  # 是否开启验证码功能（开启后登录接口要求携带验证码ID与答案）
  length: 4   # 验证码生成时的长度
httpserver:
  port: ":8080"    # 监听地址，冒号不能省略；改端口后注意同步 gb28181.media.hookport
  allowcrossdomain: true    #是否允许跨域
  serverrootpath: "/public" # 静态资源路由路径
  serverroot: "./resource/public" # 静态资源根目录
  read_timeout: 30    # TCP读取超时(秒)
  write_timeout: 30   # TCP写入超时(秒)
  idle_timeout: 60    # TCP空闲连接超时(秒)
  handler_timeout: 30 #  请求处理超时(秒)，超过该时间，将返回超时错误
  trustedproxies: [] # 明确配置反向代理 IP/CIDR；为空时不信任 X-Forwarded-For
processauthority:
  # 留空时按当前运行账户使用平台默认目录并自动创建；高级部署可覆盖为绝对路径。
  # 显式配置的目录仍必须预先存在、非符号链接、运行用户所有。
  # Unix 0700；Windows 仅运行账户/SYSTEM/Administrators 可访问。
  # 不放在 current/releases、公开 uploads、日志或临时目录；升级保留目录和锁文件。
  state_dir: "" # 例如 /opt/uvp-gb28181/data/process-authority
openapi:
  enabled: false # 首版单 API 进程；启动时决定，默认关闭；媒体申请仍受独立门禁
  play_enabled: false # 仅启动期激活；需完整媒体门禁，启用后的持久鉴权锁不随关闭接入解除
  audience: "" # 部署固定的随机环境标识，不同环境不得共享
  master_key_id: "" # 必须与已有密文 keyId 匹配；不在此文件存主密钥
  # 主密钥仅从 UVP_OPENAPI_MASTER_KEY 注入：32 随机字节的无填充 base64url
  tls_terminator_proxies: [] # 单独授权的 TLS 终止代理 IP/CIDR，不自动继承 trustedproxies
  request_timeout_seconds: 5 # 预留末尾 1 秒同步审计；HTTP write_timeout 必须大于此值+1
  revocation_bindings_file: "" # 运维受控文件绝对路径；空值不启动清退。仅启动读取，独立于上面两个开关；见 openapi-revocation.example.yml
token:
  jwttokensignkey:  "CHANGE_ME_TO_A_RANDOM_SECRET"   # ⚠️ 部署前必须改成项目专属随机字符串(token 加密签名,泄露=任何人可伪造 token)
  jwttokenexpire:  43200    #设置token过期时间，单位秒 示例:43200=12小时
  jwttokenrefreshexpire:  2592000  #设置刷新token过期时间，单位秒 示例:2592000=30天
  cachekeyprefix: "uvp-gb28181:"  # 缓存前缀
  isCache: false  # 是否开启token缓存 (注意开启后会降低token验证的性能,但是注销token后token立即失效)
# 仅当 server.cachetype=redis 时生效；连接池由 go-redis 自行管理，本段不再提供池参数
redis:
  host: "127.0.0.1"        # Redis 地址
  port: 6379               # Redis 端口
  password: ""             # Redis 密码，无密码留空
  indexdb: 1               # 使用的 DB 序号；默认是 1 号库，不是 0 号库
logs:
  outputs: [file, stdout]     # 开发默认；直接部署用 [file]，容器用 [stdout]
  filepath: "./resource/logs/uvp-gb28181.log" # 显式绝对路径也支持；不再生成独立 gin 日志
  textformat: "console"      # 文件：console/json；生产建议 json
  stdoutformat: "console"    # stdout：console/json；容器建议 json
  level: "info"              # debug/info/warn/error；变更日志配置需重启
  modules:                    # 按子系统单独设置级别，未列出的子系统跟随 level
    access: "info"           # 独立于根 level，保留访问摘要
    scheduler: "info"        # 调度与定时任务日志
  routes: false               # 是否输出路由登记日志，不控制调试接口
  maxsize: 5                  # 单文件 MiB
  maxbackups: 7               # 归属当前 writer 的备份上限，旧历史文件保留
  maxage: 15                  # 备份保留天数
  compress: false             # 轮转出来的备份是否 gzip 压缩
casbin:                       # 权限模型（RBAC），策略存于数据库
  autoloadpolicyseconds: 120  # 扫描数据库策略的频率(单位：秒)
  tableprefix: "sys_"         # 策略表前缀，与迁移脚本保持一致
  tablename: "casbin_rule"    # 策略表名
  modelconfig: | # 竖线 | 表示以下整段文本保持换行格式
    [request_definition]
    r = sub, obj, act, dom
    [policy_definition]
    p = sub, obj, act, dom
    [role_definition]
    g = _, _, _
    [policy_effect]
    e = some(where (p.eft == allow))
    [matchers]
    m =  g(r.sub, p.sub, r.dom) && keyMatch2(r.obj, p.obj) && regexMatch(r.act, p.act) && (r.dom == p.dom || p.dom == "*")
# 数据库连接。三个方言块结构完全一致，实际用哪个由 usedbtype 与各自的 isinitglobalgorm* 决定
gormv2: # 只针对 gorm  操作数据库有效
  usedbtype: "mysql"   # 默认使用的数据库类型（mysql、sqlserver、postgresql）
  mysql:
    isinitglobalgormmysql: 1      # 随项目启动初始化一个全局变量 gorm.Db（1=开启、0=关闭）
    slowthreshold: 30            # 慢 SQL 阈值（秒）；⚠️ 必须写裸数字(30)，禁止写 "30s" —— 代码已 GetDuration×time.Second，带单位会溢出成负数
    loglevel: "warn"             # SQL 日志级别：silent/error/warn/info；未配置或未知值=warn。info 会打印每条 SQL，生产勿开
    timezone: "Local"            # 时区配置，写入 DSN 的 parseTime/loc；例如: Local, Asia/Shanghai, UTC 等
    write:                       # 写库(主库)连接参数，始终生效
      host: "127.0.0.1"          # 数据库地址
      database: "uvp_gb28181"    # 库名
      port: 3306                 # 端口
      user: "root"               # 账号
      pass: "root"               # 密码
      charset: "utf8mb4"         # 连接字符集
      setmaxidleconns: 10    # 最大空闲连接数
      setmaxopenconns: 128   # 最大打开连接数
      setconnmaxlifetime: 60    # 连接最大生存时间(秒)
      setconnmaxidletime: 30    # 空闲连接最大存活时间(秒)
    isopenreaddb: 0                     # 是否开启读写分离配置（1=开启、0=关闭），IsOpenReadDb=1,Read 部分参数有效，否则Read部分参数直接忽略
    read:                       # 读库(从库)连接参数，仅 isopenreaddb=1 时装配
      host: "127.0.0.1"
      database: "uvp_gb28181"
      port: 3306                        #注意，非3306，请自行调整
      user: "root"
      pass: "root"  # 修改为你自己的数据库密码
      charset: "utf8mb4"
      setmaxidleconns: 10    # 最大空闲连接数
      setmaxopenconns: 128    # 最大打开连接数
      setconnmaxlifetime: 60    # 连接最大生存时间(秒)
      setconnmaxidletime: 30    # 空闲连接最大存活时间(秒)
  sqlserver:
    isinitglobalgormsqlserver: 0  # 随项目启动初始一个全局变量 gorm.Db（1=开启、0=关闭）
    slowthreshold: 30            # 慢 SQL 阈值（秒），裸数字，不要带单位
    loglevel: "warn"             # SQL 日志级别：silent/error/warn/info；缺省=warn
    timezone: ""                  # SQL Server 不需要时区配置
    write:                       # 写库(主库)连接参数
      host: "127.0.0.1"
      database: "uvp_gb28181"
      port: 1433
      user: ""
      pass: ""
      setmaxidleconns: 10    # 最大空闲连接数
      setmaxopenconns: 128   # 最大打开连接数
      setconnmaxlifetime: 60    # 连接最大生存时间(秒)
      setconnmaxidletime: 30    # 空闲连接最大存活时间(秒)
    isopenreaddb: 0            # 是否开启读写分离配置（1=开启、0=关闭
    read:                       # 读库(从库)连接参数，仅 isopenreaddb=1 时装配
      host: "127.0.0.1"
      database: "uvp_gb28181"
      port: 1433
      user: ""
      pass: ""
      setmaxidleconns: 10   
      setmaxopenconns: 128
      setconnmaxlifetime: 60  # 连接最大生存时间(秒)
      setconnmaxidletime: 30    # 空闲连接最大存活时间(秒)
  postgresql:
    isinitglobalgormpostgresql: 0   # 随项目启动初始一个全局变量 gorm.Db（1=开启、0=关闭）
    slowthreshold: 30            # 慢 SQL 阈值（秒），裸数字，不要带单位
    loglevel: "warn"             # SQL 日志级别：silent/error/warn/info；缺省=warn
    timezone: "Asia/Shanghai"       # 时区配置，例如: Asia/Shanghai, UTC 等
    write:                       # 写库(主库)连接参数
      host: "127.0.0.1"
      database: "uvp_gb28181"
      port: 5432
      user: ""
      pass: ""
      setmaxidleconns: 10    # 最大空闲连接数
      setmaxopenconns: 128   # 最大打开连接数
      setconnmaxlifetime: 60    # 连接最大生存时间(秒)
      setconnmaxidletime: 30    # 空闲连接最大存活时间(秒)
    isopenreaddb: 0            # 是否开启读写分离配置（1=开启、0=关闭），IsOpenReadDb=1,Read  部分参数有效，否则Read部分参数直接忽略
    read:                       # 读库(从库)连接参数，仅 isopenreaddb=1 时装配
      host: "127.0.0.1"
      database: "uvp_gb28181"
      port: 5432
      user: ""
      pass: ""
      setmaxidleconns: 10    # 最大空闲连接数
      setmaxopenconns: 128   # 最大打开连接数
      setconnmaxlifetime: 60    # 连接最大生存时间(秒)
      setconnmaxidletime: 30    # 空闲连接最大存活时间(秒)

# 文件上传配置
upload:
  # 上传方式: local-本地上传, qiniu-七牛云上传
  upload_type: "local"
  
  # 最大文件大小(单位: MB)
  max_size: 10
  
  # 允许的文件类型
  allowed_types: [".jpg", ".jpeg", ".png", ".gif", ".bmp", ".pdf", ".doc", ".docx", ".xls", ".xlsx", ".txt", ".zip", ".rar", ".svg", ".ico", ".mp4", ".avi", ".webp"]
  
  # 本地上传路径
  local_path: "./resource/public/uploads"
  
  # 七牛云配置
  qiniu_config:
    access_key: ""      # 七牛云AccessKey
    secret_key: ""      # 七牛云SecretKey
    bucket: ""           # 七牛云存储空间名称
    domain: ""           # 七牛云域名
    zone: "ZoneHuadong"  # 七牛云存储区域: ZoneHuadong, ZoneHuabei, ZoneHuanan, ZoneBeimei, ZoneXinjiapo
  
  # 分片上传配置
  # 分片上传最大文件总大小(单位: MB)
  chunk_max_size: 5120
  # 单个分片最大大小(单位: MB)
  max_chunk_size: 5
  # 分片上传允许的文件类型(为空则允许所有类型)
  chunk_allowed_types: [".jpg", ".jpeg", ".png", ".gif", ".bmp", ".pdf", ".doc", ".docx", ".xls", ".xlsx", ".txt", ".zip", ".rar", ".mp4", ".avi", ".webp", ".svg", ".ico"]

#代码生成
gen:
  # 前端代码生成路径
  dir: "../uvp-gb28181-ui"

# 任务调度器配置
scheduler:
  # 调度日志统一使用 logs.outputs；级别在 logs.modules.scheduler 配置
  job_results_buffer_size: 1000       # 任务结果通道缓冲大小，默认1000；缓冲满会阻塞结果回收

# GB28181 国标平台配置
#
# 2026-07-20 起 SIP 配置改由管理员首次登录时的引导页录入(权威源:gb_sip_config 表).
# YAML 层不再持有 SIP 明文字段. 老 stack 升级会由 setup.MigrateYAMLToDB 一次性搬迁.
# 老部署环境如果仍然通过 YAML 供参数,升级到本版本后请手动进入引导页确认或修改.
gb28181:
  enabled: true              # 是否启用国标 SIP 服务;关闭后 HTTP 依然运行,SIP 相关路由返 503
  sip_command_timeout_sec: 10 # 出站 SIP 命令默认等待时间，范围 1-300 秒
  # SIP 原始报文诊断模块。默认关闭；日志写入当前业务数据库。
  trace:
    enabled: false                                        # 关闭后不再落库，历史表保留
    queue_capacity: 8192                                  # 内存队列容量；溢出会丢弃报文诊断
    batch_size: 500                                       # 单批入库条数
    flush_interval_ms: 500                                # 未攒满时的最大落库间隔(毫秒)
    encryption_key_env: "UVP_SIP_TRACE_ENCRYPTION_KEY"    # 存放报文加密密钥的环境变量名，不在此文件写明文
    retention_days: 7                                     # 报文保留天数，到期清理
  device:
    default_owner_dept_id: 1 # 首次自动建档默认归属部门；建议改成"待分配/接入池"部门
    keepalive_interval: 60   # 设备心跳周期(秒)
    keepalive_timeout_count: 3 # 连续丢失阈值,超过判离线
    keepalive_grace_seconds: 15 # 离线判定宽限缓冲(秒),避开边界误判
    offline_scan_interval: 30 # 离线扫描周期(秒)
    sync_channels_on_online: true # 设备上线或离线恢复时同步 Catalog 通道
    online_on_heartbeat: true # 收到心跳时将离线设备恢复为在线；关闭后仍更新时间但不恢复状态
    preallocation_mode: false # 开启后仅允许设备表中预先存在的国标 ID 注册
  catalog:
    ignore_channel_offline_status_notify: false # 兼容错误状态上报：忽略 Catalog NOTIFY 的 OFF/VLOST/DEFECT
    # 以下四项是「新建目录通道」入库时写入的默认值；改这里只影响之后建档的通道，存量通道不变
    default_channel_stream_transport: "TCP-Passive" # UDP / TCP-Active / TCP-Passive；非法值回落 TCP-Passive
    default_channel_audio_enabled: true             # 新通道默认是否开启音频
    default_channel_on_demand_live: true            # 新通道默认点播按需拉流
    default_channel_cloud_recording_enabled: false  # 新通道默认云端录像
  alarm:
    save_messages: true # 是否将设备报警通知写入报警记录；关闭后仍接收和解析通知
  position_history:
    enabled: true             # 是否保存位置历史轨迹；关闭后仍更新最新位置
    retention_days: 7         # 历史轨迹保留天数，范围 1-365
  sdp:
    extension_enabled: false  # 部分设备需要的扩展 SDP 媒体编码兼容模式，一般无需开启
  ptz:
    default_speed_level: 6    # 云台控制界面默认速度档位，范围 1-10
  # 全局默认订阅项：还没有设备级订阅行时使用，可在"设备-订阅"覆盖
  subscribe:
    global_items: ["catalog", "mobile_position", "alarm", "ptz_precise_position"]
    # 四项之外的值会被静默忽略并去重；不配=空数组(不建立任何订阅)
  # ZLMediaKit 媒体服务器 — 首次部署 seed(数据面)
  #
  # 仅作 meta_node 表为空时的 seed 兜底:启动时若 DB 已存在节点,本配置忽略,
  # 运行时通过"流媒体节点"UI 管理多节点。yaml 改值不会影响已 seed 节点。
  zlm:
    host: "127.0.0.1"             # ZLM 地址
    receivehost: ""               # 设备收流地址,留空跟随 host
    playbackhost: ""              # 播放访问地址,可填公网 IP 或域名,留空跟随 host
    httpport: 18080               # ZLM HTTP API 端口
    secret: "CHANGE_ME"           # ZLM API secret(部署时填 ZLM 实际 secret)
    rtpport: 40000                # RTP 单端口收流
  # 媒体/Hook 配置
  media:
    hookbaseurl: ""               # 推荐:完整回调根,如 https://hook.example.com/index/hook
    hookrequiretls: false          # 公网部署必须设 true；内网/VPN 可按安全边界保留 false
    hookhost: "127.0.0.1"         # 兼容旧配置:hookbaseurl 为空时与 hookport 派生 HTTP 回调根
    hookport: 8280                 # 兼容旧配置:后端 HTTP 端口
    streamnonereadertimeout: 20   # 无人观看多少秒后断流
    rtpservertimeout: 15          # RTP 收流超时(秒)
  # 设备/NVR 本地录像查询。时间输入按平台时区墙钟解释，不按浏览器时区转换。
  record_query:
    timezone: "Asia/Shanghai"     # 显式 IANA 时区；非法值会阻止查询/回放 runtime 装配
    timeout_sec: 15               # 单条查询超时；必须小于 httpserver.handler_timeout
    max_range_hours: 24           # 单次查询允许的最大时间跨度(小时)
    max_active_queries: 128       # 并发查询上限，超出直接拒绝
    max_records_per_query: 20000  # 单设备单查询返回的最大记录条数
    result_ttl_sec: 1800          # 查询结果缓存有效期(秒)
  playback:
    default_protocol: "ws-flv"    # ws-flv / http-flv / hls / webrtc；非法值回落 ws-flv，已建会话不受影响
    media_wait_sec: 10            # SIP 成功后等待回放媒体上线
    idle_timeout_sec: 60          # 无控制/读取活动后的回收时间
    max_session_sec: 86400        # 单会话绝对上限，不超过 24 小时
  play:
    # 点播会话兜底对账 goroutine 的扫描周期(秒)；0=禁用 reconciler（开发/调试场景）。
    # ⚠️ 不配即为 0：代码用 GetInt 直取，没有兜底值,所以这里显式写出 300，别整行删掉
    reconcile_interval_sec: 300
    request_timeout_ms: 10000     # 点播请求超时(毫秒)；有效范围 1000-300000，越界回落 10000
    fixed_address_enabled: false  # 固定播放地址；开启后同一通道的点播地址保持稳定
    auto_on_demand_enabled: false # 自动按需推流；依赖上项=true，否则校验直接报错
    auth:
      enabled: false              # 播放地址鉴权，默认关闭以兼容现网
      bind_client_ip: false       # 可选 IP 绑定，仅在 enabled=true 时生效
      ttl_seconds: 120            # 播放凭证有效期，前端可配置 60-3600 秒
      active_key: ""              # 首次完成 SIP 引导时由服务端自动生成；不得复用 JWT/ZLM secret
      previous_key: ""            # 密钥轮换宽限期旧密钥，可留空
  recording:
    # 云端录像计划总开关。⚠️ 缺省为 true —— 代码判 `Get()==nil || GetBool()`，
    # 只有显式写 false 才是关闭；想关必须写出来，删掉整行反而开启
    plan_enabled: true
    reconcile_interval_sec: 30   # 云端录像对账周期(秒);0 仅禁用周期任务
    catalog_reconcile_interval_sec: 21600 # 录像文件目录周期对账(秒);0 只禁周期,保留手动对账
    catalog_periodic_lookback_days: 2     # 周期对账逻辑回看天数
    catalog_manual_lookback_days: 7       # 首次/手动对账默认逻辑回看天数
    capability_key_env: "UVP_CLOUD_RECORDING_CAPABILITY_KEY" # 可选覆盖；未配置时自动从 JWT 根密钥派生，禁止复用 JWT/ZLM secret
