server {
    listen 80;
    server_name _;
    absolute_redirect off;
    client_max_body_size 6g;

    # 该测试前端可能被 NPM 反代。只接受本机或已有可信私网代理的
    # X-Forwarded-Proto；公网客户端不能靠伪造该头改变设备回传入口。
    set $uvp_device_proxy_trusted 0;
    if ($remote_addr ~ ^127\.) { set $uvp_device_proxy_trusted 1; }
    if ($remote_addr = ::1) { set $uvp_device_proxy_trusted 1; }
    if ($remote_addr ~ ^10\.) { set $uvp_device_proxy_trusted 1; }
    if ($remote_addr ~ ^172\.(1[6-9]|2[0-9]|3[0-1])\.) { set $uvp_device_proxy_trusted 1; }
    if ($remote_addr ~ ^192\.168\.) { set $uvp_device_proxy_trusted 1; }
    set $uvp_device_external_base "";
    if ($http_x_forwarded_proto ~ ^(?<uvp_device_external_scheme>https?)$) {
        set $uvp_device_external_base "$uvp_device_external_scheme://$http_host";
    }
    if ($uvp_device_proxy_trusted = 0) {
        set $uvp_device_external_base "";
    }
    set $uvp_device_http_base "http://$http_host";
    if ($uvp_device_external_base != "") {
        set $uvp_device_http_base $uvp_device_external_base;
    }

    root /usr/share/nginx/html;
    index index.html;

    location = /system {
        return 301 /;
    }

    location /system/ {
        return 301 /;
    }

    location = / {
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ ^/api/gb28181/cloud-recordings/downloads/[^/]+/content$ {
        proxy_pass http://wvp-backend:18978;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-UVP-Device-Base-URL $uvp_device_http_base;
        proxy_buffering off;
        proxy_request_buffering off;
        gzip off;
        access_log off;
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location = /api/system/upgrade/import {
        client_max_body_size 9g;
        client_body_timeout 30m;
        proxy_pass http://wvp-backend:18978;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-UVP-Device-Base-URL $uvp_device_http_base;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30m;
        proxy_read_timeout 30m;
        proxy_request_buffering off;
        proxy_buffering off;
    }

    location /api/ {
        proxy_pass http://wvp-backend:18978;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-UVP-Device-Base-URL $uvp_device_http_base;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 30s;
        proxy_read_timeout 86400s;
        proxy_send_timeout 300s;
    }

    location /gb28181/ {
        proxy_pass http://wvp-backend:18978;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-UVP-Device-Base-URL $uvp_device_http_base;
        proxy_set_header Connection "";
    }

    location ~ ^/openapi(?:/|$) {
        proxy_pass http://wvp-backend:18978;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-UVP-Device-Base-URL $uvp_device_http_base;
        proxy_set_header Connection "";
    }

    location /public/ {
        proxy_pass http://wvp-backend:18978;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
}
