# Add this location to the HTTPS virtual host that receives Gitee WebHook.
# The Go receiver intentionally listens only on loopback.
location = /hooks/gitee {
    proxy_pass http://127.0.0.1:17890;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 15s;
    client_max_body_size 1m;
}

location = /hooks/gitee/healthz {
    proxy_pass http://127.0.0.1:17890/healthz;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_read_timeout 5s;
}
