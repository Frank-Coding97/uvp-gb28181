# ------------------------------------------------------------
# uvplatform.com / www.uvplatform.com -> UVP GB28181
# Managed outside the NPM UI for the test deployment.
#
# ⚠️ 域名已从 .cn 切到 .com（2026-10-07），部署前必须先备齐两件事，否则线上不可达：
#   1. DNS：uvplatform.com 与 www.uvplatform.com 的 A 记录指向这台机器；
#   2. 证书：下面 ssl_certificate 指向的 /data/custom_ssl/npm-1/ 是为**旧域名**签发的
#      let's-encrypt 证书，域名不匹配会被浏览器直接拦。需要在 NPM 里为新域名
#      重新签发（或换自签），证书文件名也会随之变化。
#      ⚠️ 证书没换之前不要只改 server_name —— 那等于把服务挂在别人证书的域名下。
# ------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name uvplatform.com www.uvplatform.com;

    include conf.d/include/letsencrypt-acme-challenge.conf;

    location / {
        return 301 https://www.uvplatform.com$request_uri;
    }
}

server {
    set $forward_scheme http;
    set $server 192.168.168.101;
    set $port 56000;

    listen 443 ssl;
    listen [::]:443 ssl;
    server_name uvplatform.com www.uvplatform.com;
    http2 on;

    include conf.d/include/ssl-cache.conf;
    include conf.d/include/ssl-ciphers.conf;
    ssl_certificate /data/custom_ssl/npm-1/fullchain.pem;
    ssl_certificate_key /data/custom_ssl/npm-1/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;

    access_log /data/logs/uvplatform_access.log proxy;
    error_log /data/logs/uvplatform_error.log warn;

    if ($host = uvplatform.com) {
        return 301 https://www.uvplatform.com$request_uri;
    }

    location / {
        include conf.d/include/proxy.conf;
        proxy_cookie_flags ~^uvp_recording_download_ secure httponly samesite=strict;
    }
}
