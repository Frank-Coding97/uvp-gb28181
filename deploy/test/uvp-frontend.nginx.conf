# UVP GB28181 frontend (host nginx, serves the release tree)
# Symlinked into /etc/nginx/sites-enabled/ by install-gitee-deployer.sh.
# The document root follows /opt/uvp-gb28181/current, so a release switch
# needs no nginx reload.
server {
    listen 56000;
    server_name _;
    absolute_redirect off;
    client_max_body_size 6g;

    root /opt/uvp-gb28181/current/frontend/dist;
    index index.html;

    location = /system {
        return 301 /;
    }

    location /system/ {
        return 301 /;
    }

    location = / {
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ ^/api/gb28181/cloud-recordings/downloads/[^/]+/content$ {
        proxy_pass http://127.0.0.1:56001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        gzip off;
        access_log off;
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:56001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 30s;
        proxy_read_timeout 86400s;
        proxy_send_timeout 300s;
    }

    location /public/ {
        proxy_pass http://127.0.0.1:56001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
}
