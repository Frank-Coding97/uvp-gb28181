# 精简版 ffmpeg 的组件白名单 —— Linux 与 Windows 两条出包线**共用这一份**。
#
# 为什么要有这份清单：完整版 ffmpeg 会让交付包顶过 Gitee 发行版的单附件上限
# （100MiB / 104857600 字节）。Windows 那个完整版 ffmpeg.exe 单个就 105MB，
# Linux 版 20.9/32.8MB，而 ZLM 一辈子用不到其中的绝大多数编解码器。
#
# ⭐ 唯一依据 = ZLM 实际怎么调 ffmpeg（deploy/standalone/bin/zlm/config.ini）：
#     snap = %s -i <rtsp/http> -y -f mjpeg -frames:v 1 -an out.jpg        ← 通道抓拍
#     cmd  = %s -re -i <src> -c:a aac -ar 44100 -c:v libx264 -f flv out   ← 推流模板
#   ⇒ 必须有：rtsp/rtp/sdp 解封装、h264/hevc/aac/mjpeg 解码、mjpeg/png 编码、
#     mjpeg/mp4/flv/mpegts 封装、scale/format（像素格式转换）。
#   ⚠️ `cmd` 模板里的 libx264 我们**本来就没编**（--disable-autodetect 挡掉了外编库，
#      ffmpeg 也没有原生 H.264 编码器），那条模板在精简前后一样跑不通，不是这次造成的。
#   ⚠️ 不要 `--enable-encoder=h264`：那不是合法编码器名，ffmpeg 会当未知项忽略，
#      写上去只会让后来的人误以为「H.264 编码是可用的」。
#
# ⛔⛔ 这是**白名单**：漏一个组件不会在构建期报错，只会在客户现场
#   「抓拍失败 / 转推失败」，而且 ZLM 会把它吞成一行 642 字节的 execv 日志
#   —— 就是当初「部署起就静默不可用」的那个坑。
#   ⇒ 改这份清单必须重跑 deploy/standalone/scripts 里的抓拍/转推验证，
#      别凭「应该用不到」删任何一行。
#
# 每行一个 configure 参数；`#` 开头为注释。

--disable-everything
--enable-network

# 协议：输入侧 rtsp/rtp/tcp/udp/http/file/pipe；输出侧 flv(rtmp)/hls
#   ⚠️ 这一行里的 `rtsp` 在 7.1.x 上是**空转**——rtsp 不是独立 protocol 组件
#      （libavformat/Makefile 里 rtsp.o 只挂在 CONFIG_RTSP_DEMUXER/MUXER 下，
#      configure 里没有任何 rtsp_protocol_* 行），configure 会静默忽略这个名字。
#      真正的 rtsp 输入能力来自下面 --enable-demuxer=rtsp。
#   ⛔ 别因为「留着没用」把它删掉：两条线共用这一份清单，将来 ffmpeg 恢复该组件
#      这行就重新生效；而且删它也不会让产物变小，只会让下次排障的人多绕一圈。
--enable-protocol=rtsp,rtp,tcp,udp,http,file,pipe,crypto,data,rtmp,hls

# 解封装：GB28181 收流是裸 h264/hevc/PS，转推与录制是 mp4/flv/ts
--enable-demuxer=rtsp,sdp,rtp,mov,matroska,flv,live_flv,mpegts,mpegps,h264,hevc
--enable-demuxer=aac,mjpeg,mpjpeg,image2,hls,concat,mp3,wav,pcm_s16le,pcm_alaw,pcm_mulaw

# 解码：视频主链路 + GB28181 常见音频（G.711 / AAC）
--enable-decoder=h264,hevc,mjpeg,png,aac,mp3,ac3,pcm_s16le,pcm_alaw,pcm_mulaw
--enable-parser=h264,hevc,aac,mjpeg,png,mpegaudio
--enable-bsf=h264_mp4toannexb,hevc_mp4toannexb,aac_adtstoasc,extract_extradata,vp9_superframe

# 编码：抓拍要 mjpeg/png；转推与录制要 aac（原生）；H.264 编码需外编库，不在此列
--enable-encoder=mjpeg,png,aac,pcm_s16le

# 封装：抓拍 mjpeg/image2；转推与云端录制 mp4/flv/ts/hls
--enable-muxer=mjpeg,mpjpeg,image2,mp4,mov,matroska,flv,mpegts,rawvideo,adts,segment,hls

# 过滤器：像素格式 / 分辨率 / 帧率这几类是抓拍与转推的必经环节
--enable-filter=scale,format,fps,transpose,crop,pad,setsar,setdar,aresample
--enable-filter=anull,null,copy,overlay,yadif,select,setpts,split,hflip,vflip
