<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>UVP · 国标级联 · 业务分组 · 重设计原型 v2</title>
<style>
/* ============================================================
   UVP 国标级联 —「业务分组」重设计原型 v2（精简版）
   相比 v1 删掉：页面标题区 / 独立发布条 / 概览卡片 / 三处重复说明文案
   布局收敛为三条横带：头部（标题+发布）· 步骤条 · 工作区 + 底栏
   视觉基准：web/src/style/var/uvp-ui-tokens.scss（亮色段）
   ============================================================ */

* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg-page: #f3f7fb;
  --panel: #ffffff;
  --panel-border: #e8edf5;
  --line: #eef3f9;

  --brand: #2563eb;
  --brand-strong: #1d4ed8;
  --brand-soft: #e8f2ff;

  --text-1: #1f2937;
  --text-2: #4b5563;
  --text-3: #6b7280;
  --text-disabled: #a8b4c4;

  --fill-1: #f8fbff;
  --fill-2: #f1f5f9;
  --head-bg: #f5f9fd;

  --danger: #d14343;
  --success: #059669;
  --warning: #b66b12;

  --r-lg: 14px;
  --r-md: 10px;
  --r-sm: 8px;
  --r-xs: 6px;

  --font: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
          "Microsoft YaHei", "Segoe UI", sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
}

html, body { height: 100%; }
body {
  font-family: var(--font);
  font-size: 13px;
  line-height: 1.5;
  color: var(--text-1);
  background: var(--bg-page);
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
  padding: 20px;
  display: flex;
  justify-content: center;
  align-items: flex-start;
}

::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 8px; border: 2px solid transparent; background-clip: padding-box; }
::-webkit-scrollbar-thumb:hover { background: #94a3b8; background-clip: padding-box; border: 2px solid transparent; }

button { font-family: inherit; font-size: inherit; cursor: pointer; border: 0; background: none; color: inherit; }
input, select { font-family: inherit; font-size: inherit; }
.mono { font-family: var(--mono); }
.truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ══════════ 对话框 ══════════ */
.dlg {
  width: min(1120px, 100%);
  display: flex;
  flex-direction: column;
  background: var(--panel);
  border: 1px solid var(--panel-border);
  border-radius: var(--r-lg);
  box-shadow: 0 24px 64px -30px rgb(15 23 42 / 30%);
  overflow: hidden;
}

/* ── 带 1：头部 ───────────────────────────── */
.head {
  display: flex;
  align-items: center;
  gap: 12px;
  height: 54px;
  padding: 0 14px 0 16px;
  border-bottom: 1px solid var(--panel-border);
}
.head__ico {
  width: 28px; height: 28px; flex: none;
  display: grid; place-items: center;
  border-radius: var(--r-sm);
  background: var(--brand-soft);
  color: var(--brand);
}
.head__title { font-size: 14px; font-weight: 650; letter-spacing: -.1px; white-space: nowrap; }
.head__title em {
  font-style: normal; font-weight: 500; color: var(--text-3); font-size: 12px; margin-left: 6px;
}
.head__gap { flex: 1; }

/* 发布开关 */
.pub { display: flex; align-items: center; gap: 8px; }
.pub__label { font-size: 12px; color: var(--text-3); white-space: nowrap; }
.switch { position: relative; width: 34px; height: 19px; flex: none; display: block; }
.switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.switch .track {
  display: block; width: 100%; height: 100%;
  background: #cfd8e3; border-radius: 999px; transition: background .18s;
}
.switch .knob {
  position: absolute; top: 2px; left: 2px;
  width: 15px; height: 15px; border-radius: 50%; background: #fff;
  box-shadow: 0 1px 3px rgb(15 23 42 / 25%);
  transition: transform .18s cubic-bezier(.22,1,.36,1);
}
.switch input:checked + .track { background: var(--brand); }
.switch input:checked ~ .knob { transform: translateX(15px); }

/* ── 带 2：步骤条 ─────────────────────────── */
.steps {
  display: flex;
  align-items: center;
  height: 42px;
  padding: 0 18px;
  background: var(--fill-1);
  border-bottom: 1px solid var(--line);
  overflow-x: auto;
  scrollbar-width: none;
}
.steps::-webkit-scrollbar { display: none; }
.step {
  display: flex; align-items: center; gap: 7px;
  flex: none;
  cursor: pointer;
  white-space: nowrap;
}
.step + .step::before {
  content: "";
  width: 26px; height: 1.5px;
  margin: 0 10px;
  background: #dbe4ef;
  flex: none;
}
.step.done + .step::before { background: #a7d9c2; }
.step__n {
  width: 20px; height: 20px; flex: none;
  display: grid; place-items: center;
  border-radius: 50%;
  font-size: 11px; font-weight: 650;
  background: #e9eef5; color: var(--text-3);
  border: 1.5px solid #dde5ef;
}
.step__lb { font-size: 12.5px; color: var(--text-3); }
.step.active .step__n { background: var(--brand); border-color: var(--brand); color: #fff; box-shadow: 0 0 0 3.5px rgb(37 99 235 / 13%); }
.step.active .step__lb { color: var(--brand-strong); font-weight: 650; }
.step.done .step__n { background: #e7f7ef; border-color: #b7e4d0; color: var(--success); }
.step.done .step__lb { color: var(--success); }
.steps__hint { margin-left: auto; padding-left: 16px; font-size: 11.5px; color: var(--text-3); white-space: nowrap; }

/* ── 带 3：工作区 ─────────────────────────── */
.body {
  display: grid;
  grid-template-columns: 232px minmax(0, 1fr);
  height: 452px;
  background: var(--panel);
}

/* 左：组织树 */
.tree {
  display: flex; flex-direction: column; min-height: 0;
  border-right: 1px solid var(--panel-border);
  background: var(--fill-1);
}
.tree__search { padding: 10px 10px 6px; }
.tree__search input {
  width: 100%; height: 30px; padding: 0 9px;
  border: 1px solid #e2e9f2; border-radius: var(--r-xs);
  background: #fff; color: var(--text-1); outline: none;
  transition: box-shadow .15s;
}
.tree__search input::placeholder { color: var(--text-disabled); }
.tree__search input:focus { box-shadow: inset 0 0 0 1px rgb(37 99 235 / 30%); }
.tree__list { flex: 1; min-height: 0; overflow-y: auto; padding: 0 8px 10px; }

.tnode {
  display: flex; align-items: center; gap: 7px;
  width: 100%; min-height: 30px; padding: 4px 8px;
  border-radius: var(--r-xs);
  text-align: left; color: var(--text-1);
  transition: background .12s;
}
.tnode:hover { background: rgb(255 255 255 / 85%); }
.tnode.sel { background: var(--brand-soft); }
.tnode.sel .tnode__lb { font-weight: 650; }
.tnode__ic { width: 15px; height: 15px; flex: none; display: grid; place-items: center; }
.tnode.lv1 { padding-left: 24px; }
.tnode.lv2 { padding-left: 40px; }
.tnode__lb { flex: 1; min-width: 0; font-size: 12.5px; }
.tnode__c { flex: none; font-size: 11px; color: var(--text-3); }
.tnode__c.has { color: var(--brand-strong); font-weight: 600; }
.tnode__c.zero { color: var(--warning); font-weight: 600; }
.tree__sep { height: 1px; background: #e4ebf4; margin: 8px 8px; }
.tnode.todo .tnode__lb { color: var(--warning); }
.tnode.todo .tnode__c { background: #fdf1e3; color: var(--warning); font-weight: 650; padding: 0 6px; border-radius: 999px; }

/* 右：内容 */
.panel { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.panel__bar {
  display: flex; align-items: center; gap: 10px;
  padding: 11px 14px;
  border-bottom: 1px solid var(--line);
  min-height: 48px;
}
.crumb { display: flex; align-items: center; gap: 5px; min-width: 0; flex: 1; font-size: 12px; color: var(--text-3); }
.crumb b { color: var(--text-1); font-weight: 650; font-size: 13px; }
.crumb i { font-style: normal; color: #cbd5e1; }
.panel__acts { display: flex; align-items: center; gap: 8px; margin-left: auto; }
.panel__scroll { flex: 1; min-height: 0; overflow-y: auto; }

/* 字段行（紧凑一行，不再是 2×2 卡片） */
.fields {
  display: flex; gap: 20px; flex-wrap: wrap;
  padding: 12px 14px;
  border-bottom: 1px solid var(--line);
}
.fld { display: flex; align-items: center; gap: 8px; min-width: 0; }
.fld > span { font-size: 12px; color: var(--text-3); white-space: nowrap; }
.fld input {
  width: 200px; height: 30px; padding: 0 9px;
  border: 1px solid var(--panel-border); border-radius: var(--r-xs);
  background: #fff; color: var(--text-1); outline: none;
}
.fld input:focus { box-shadow: inset 0 0 0 1px rgb(37 99 235 / 30%); }
.fld .ro {
  display: flex; align-items: center; height: 30px; padding: 0 9px;
  border-radius: var(--r-xs); background: var(--fill-2);
  color: var(--text-2); font-family: var(--mono); font-size: 11.5px;
}

/* 区块标题（极简单行） */
.blk {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 14px 8px;
}
.blk strong { font-size: 12.5px; font-weight: 650; }
.blk span { font-size: 11.5px; color: var(--text-3); }
.blk button { margin-left: auto; }

/* 表格 */
.tbl { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 12.5px; }
.tbl th {
  text-align: left; font-weight: 650; font-size: 11.5px; color: var(--text-3);
  background: var(--head-bg); padding: 7px 14px;
  border-top: 1px solid #e6edf7; border-bottom: 1px solid #e6edf7;
}
.tbl th:last-child, .tbl td:last-child { text-align: right; }
.tbl td { padding: 8px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tbl tbody tr:hover { background: var(--fill-1); }
.tbl .nm { display: flex; align-items: center; gap: 7px; }
.tbl .nm .dot { width: 6px; height: 6px; border-radius: 50%; flex: none; background: #9ca3af; }
.tbl .nm .dot.on { background: var(--success); }
.tbl .cd { font-family: var(--mono); font-size: 11px; color: var(--text-3); }
.tbl .empty td { text-align: center; padding: 34px 14px; color: var(--text-3); }
.tbl .empty strong { display: block; color: var(--text-2); font-weight: 600; margin-bottom: 3px; }

/* 链接式操作 */
.lk { color: var(--brand-strong); font-size: 12px; }
.lk:hover { text-decoration: underline; text-underline-offset: 2px; }
.lk.dg { color: var(--danger); }
.lk + .lk { margin-left: 11px; }

/* 标签 */
.tag { display: inline-flex; align-items: center; height: 19px; padding: 0 6px; border-radius: 4px; font-size: 11px; white-space: nowrap; }
.tag.ok { background: #e7f7ef; color: var(--success); }
.tag.wait { background: #fdf1e3; color: var(--warning); }
.tag.gray { background: var(--fill-2); color: var(--text-3); }
.tag.new { background: var(--brand-soft); color: var(--brand-strong); }

/* ── 带 3 尾：底栏 ─────────────────────────── */
.foot {
  display: flex; align-items: center; gap: 10px;
  height: 54px; padding: 0 14px;
  border-top: 1px solid var(--panel-border);
  background: var(--fill-1);
}
.foot__msg { flex: 1; min-width: 0; display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--text-2); }
.foot__msg .dot { width: 6px; height: 6px; border-radius: 50%; flex: none; }
.foot__msg.dirty { color: var(--warning); font-weight: 650; }
.foot__msg.dirty .dot { background: var(--warning); }
.foot__msg.clean .dot { background: var(--success); }
.foot__msg em { font-style: normal; color: var(--text-3); font-weight: 400; }
.foot__msg em b { color: var(--brand-strong); font-weight: 650; }
.foot__btns { display: flex; gap: 8px; margin-left: auto; }

/* ── 按钮 ── */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 5px;
  height: 30px; padding: 0 12px;
  border: 1px solid #dce4ee; border-radius: var(--r-xs);
  background: #fff; color: var(--text-2);
  font-size: 12.5px; white-space: nowrap;
  transition: all .15s;
}
.btn:hover { border-color: #c3cfdd; background: var(--fill-1); color: var(--text-1); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.pri { background: var(--brand); border-color: var(--brand); color: #fff; font-weight: 500; }
.btn.pri:hover:not(:disabled) { background: var(--brand-strong); border-color: var(--brand-strong); color: #fff; }
.btn.tx { border-color: transparent; background: transparent; color: var(--brand-strong); }
.btn.tx:hover { background: var(--brand-soft); border-color: transparent; }
.btn.ico { width: 30px; padding: 0; }
.btn.sm { height: 26px; padding: 0 9px; font-size: 12px; }

/* ══════════ 添加通道面板（原位替换） ══════════ */
.pk__bar { display: flex; align-items: center; gap: 8px; padding: 11px 14px; border-bottom: 1px solid var(--line); }
.seg { display: inline-flex; padding: 2px; border-radius: var(--r-xs); background: var(--fill-2); }
.seg button { height: 24px; padding: 0 10px; border-radius: 5px; font-size: 12px; color: var(--text-2); }
.seg button.on { background: #fff; color: var(--brand-strong); font-weight: 650; box-shadow: 0 1px 3px rgb(15 23 42 / 11%); }
.pk__search { flex: 1; min-width: 0; }
.pk__search input {
  width: 100%; height: 30px; padding: 0 9px;
  border: 1px solid #e2e9f2; border-radius: var(--r-xs); background: var(--fill-1); outline: none;
}
.pk__search input:focus { background: #fff; box-shadow: inset 0 0 0 1px rgb(37 99 235 / 30%); }
.pk__note {
  margin: 10px 14px 0; padding: 8px 10px;
  background: var(--brand-soft); border-radius: var(--r-xs);
  font-size: 12px; color: var(--brand-strong);
}
.pk__sum { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 10px 14px; font-size: 12px; color: var(--text-2); }
.pk__sum strong { color: var(--text-1); font-weight: 650; }
.pk__sum em { font-style: normal; color: var(--text-3); }
.pk__sum em b { color: var(--brand-strong); font-weight: 650; }

/* 空状态 */
.empty-panel { display: grid; place-items: center; gap: 6px; padding: 60px 16px; text-align: center; color: var(--text-3); font-size: 12.5px; }

/* Toast */
.toast {
  position: fixed; left: 50%; top: 22px;
  transform: translate(-50%, -14px);
  background: #1f2937; color: #fff; font-size: 12.5px;
  padding: 8px 15px; border-radius: var(--r-sm);
  box-shadow: 0 12px 32px rgb(15 23 42 / 28%);
  opacity: 0; pointer-events: none; transition: all .22s cubic-bezier(.22,1,.36,1); z-index: 99;
  max-width: min(560px, 90vw);
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 820px) {
  body { padding: 10px; }
  .body { grid-template-columns: minmax(0, 1fr); height: auto; }
  .tree { border-right: 0; border-bottom: 1px solid var(--panel-border); max-height: 220px; }
  .panel { min-height: 380px; }
  .steps__hint { display: none; }
  .head__title em { display: none; }
}
</style>
</head>
<body>

<div class="dlg">

  <!-- 带 1：头部 -->
  <header class="head">
    <span class="head__ico">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M10 13h4M12 11v4"/></svg>
    </span>
    <span class="head__title">业务分组 <em>wvp-220 · GB/T 2016</em></span>
    <span class="head__gap"></span>

    <span class="pub">
      <span class="pub__label">业务目录发布</span>
      <label class="switch" title="关闭后上级查不到业务分组目录，通道共享仍然保留">
        <input type="checkbox" id="pubSwitch" />
        <span class="track"></span>
        <span class="knob"></span>
      </label>
      <button class="btn tx sm" id="pushBtn" title="推送只是向上级发一次请求，不代表上级已展示">推送目录</button>
    </span>
    <button class="btn ico" id="closeBtn" title="关闭">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </header>

  <!-- 带 2：步骤条 -->
  <nav class="steps" id="steps" aria-label="操作步骤"></nav>

  <!-- 带 3：工作区 -->
  <div class="body">
    <aside class="tree">
      <div class="tree__search">
        <input type="search" id="treeSearch" placeholder="搜索组织" />
      </div>
      <div class="tree__list" id="tree"></div>
    </aside>
    <main class="panel" id="panel"></main>
  </div>

  <!-- 带 3 尾：底栏 -->
  <footer class="foot" id="foot"></footer>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   数据（模拟一次真实维护场景）
   ============================================================ */
const state = {
  platform: "wvp-220",
  publish: true,
  dirty: false,
  view: "node",
  sel: "34020000002000000011",
  kw: "",
  pkScope: "local",
  pkKw: "",
  pkTarget: "",
  picked: new Set(),
  chg: { share: 0, join: 0, move: 0, out: 0 }
};

const C = (name, code, online, opt = {}) => ({ name, code, online, ...opt });

const nodes = [
  { code: "34020000002000000001", name: "华东片区业务分组", kind: "root", parent: "" },
  { code: "34020000002000000011", name: "一楼生产区", kind: "org", parent: "34020000002000000001" },
  { code: "34020000002000000021", name: "装配车间", kind: "org", parent: "34020000002000000011" },
  { code: "34020000002000000012", name: "二楼仓储区", kind: "org", parent: "34020000002000000001" }
];

const bindings = {
  "34020000002000000011": [
    C("车间东门枪机", "34020000001320000001", true),
    C("车间西门球机", "34020000001320000002", true),
    C("生产线一号机位", "34020000001320000003", false)
  ],
  "34020000002000000021": [
    C("装配线 A 区", "34020000001320000011", true),
    C("装配线 B 区", "34020000001320000012", false)
  ],
  "34020000002000000012": [
    C("仓库北门", "34020000001320000021", true),
    C("仓库月台", "34020000001320000022", true)
  ]
};

const unassigned = [
  C("厂区大门", "34020000001320000031", true, { share: true }),
  C("停车场出入口", "34020000001320000032", true, { share: true }),
  C("食堂前厅", "34020000001320000033", false, { share: true }),
  C("宿舍楼走廊", "34020000001320000034", true, { share: true }),
  C("配电房", "34020000001320000035", true, { share: true }),
  C("锅炉房", "34020000001320000036", false, { share: true }),
  C("污水处理站", "34020000001320000037", true, { share: true })
];

const pool = [
  C("厂区大门", "34020000001320000031", true, { share: true }),
  C("停车场出入口", "34020000001320000032", true, { share: true }),
  C("食堂前厅", "34020000001320000033", false, { share: true }),
  C("宿舍楼走廊", "34020000001320000034", true, { share: true }),
  C("配电房", "34020000001320000035", true, { share: true }),
  C("锅炉房", "34020000001320000036", false, { share: true }),
  C("污水处理站", "34020000001320000037", true, { share: true }),
  C("立体车库入口", "34020000001320000041", true),
  C("立体车库出口", "34020000001320000042", false),
  C("消防通道东", "34020000001320000043", true),
  C("消防通道西", "34020000001320000044", true),
  C("楼顶设备间", "34020000001320000045", false)
];

/* ============================================================
   工具
   ============================================================ */
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const node = (code) => nodes.find(n => n.code === code);
const kids = (code) => nodes.filter(n => n.parent === code);
const direct = (code) => (bindings[code] || []).length;
const total = (code) => direct(code) + kids(code).reduce((s, k) => s + total(k.code), 0);
const orgs = () => nodes.filter(n => n.kind === "org");
const pathOf = (code) => { const a = []; let c = node(code); while (c) { a.unshift(c.name); c = node(c.parent); } return a.join(" / "); };
const bound = () => Object.values(bindings).reduce((s, a) => s + a.length, 0);
const ownerOf = (code) => Object.keys(bindings).find(k => (bindings[k] || []).some(c => c.code === code));

function toast(m) {
  const el = $("#toast");
  el.textContent = m;
  el.classList.add("show");
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove("show"), 2400);
}

/* ============================================================
   带 2：步骤条 —— 任意时刻只有一步是"当前步"
   ============================================================ */
const STEPS = [
  { k: "tree", lb: "建立目录" },
  { k: "bind", lb: "归入通道" },
  { k: "save", lb: "保存配置" },
  { k: "pub",  lb: "发布并推送" }
];

function stepState() {
  const done = {
    tree: nodes.length > 1,
    bind: bound() > 0 && unassigned.length === 0,
    save: bound() > 0 && !state.dirty,
    pub:  bound() > 0 && state.publish
  };
  const out = {};
  let cur = false;
  STEPS.forEach(s => {
    if (!cur && done[s.k]) out[s.k] = "done";
    else if (!cur) { out[s.k] = "active"; cur = true; }
    else out[s.k] = "todo";
  });
  return out;
}

function renderSteps() {
  const st = stepState();
  const active = STEPS.find(s => st[s.k] === "active");
  const hint = !active
    ? "全部完成"
    : { tree: "先建一个业务分组根", bind: unassigned.length ? `还有 ${unassigned.length} 路通道未归入组织` : "去添加通道", save: "改动尚未保存", pub: "目录发布还没开启" }[active.k];

  $("#steps").innerHTML = STEPS.map((s, i) => {
    const status = st[s.k];
    return `<div class="step ${status}" data-step="${s.k}">
      <span class="step__n">${status === "done"
        ? '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>'
        : i + 1}</span>
      <span class="step__lb">${s.lb}</span>
    </div>`;
  }).join("") + `<span class="steps__hint">${esc(hint)}</span>`;
}

/* ============================================================
   带 3 左：组织树
   ============================================================ */
const IC = {
  root: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>',
  org: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v6M12 16v6M2 12h6M16 12h6"/></svg>'
};

function renderTree() {
  const kw = state.kw.trim().toLowerCase();
  const hit = (n) => !kw || n.name.toLowerCase().includes(kw) || n.code.includes(kw);
  const keep = new Set();
  if (kw) nodes.forEach(n => { if (hit(n)) { keep.add(n.code); let p = node(n.parent); while (p) { keep.add(p.code); p = node(p.parent); } } });

  const rows = [];
  const walk = (parent, d) => kids(parent).forEach(n => {
    if (kw && !keep.has(n.code)) return;
    rows.push({ n, d });
    walk(n.code, d + 1);
  });
  walk("", 0);

  const html = rows.map(({ n, d }) => {
    const dir = direct(n.code), tot = total(n.code), sel = state.sel === n.code;
    const cnt = n.kind === "root"
      ? `<span class="tnode__c ${tot ? "" : "zero"}">${tot}</span>`
      : kids(n.code).length
        ? `<span class="tnode__c ${dir ? "has" : "zero"}">${dir}/${tot}</span>`
        : `<span class="tnode__c ${dir ? "has" : "zero"}">${dir}</span>`;
    return `<button class="tnode lv${Math.min(d, 2)} ${sel ? "sel" : ""}" data-node="${n.code}" title="${esc(n.code)}">
      <span class="tnode__ic" style="${n.kind === "root" ? "color:#0e7490" : "color:#c2410c"}">${IC[n.kind]}</span>
      <span class="tnode__lb truncate">${esc(n.name)}</span>${cnt}
    </button>`;
  }).join("");

  const u = unassigned.length;
  $("#tree").innerHTML = (rows.length ? html : `<div class="empty-panel" style="padding:28px 8px">没有匹配的组织</div>`)
    + `<div class="tree__sep"></div>`
    + `<button class="tnode todo ${state.sel === "__u__" ? "sel" : ""}" data-node="__u__">
         <span class="tnode__ic" style="color:${u ? "#b66b12" : "#a8b4c4"}">
           <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h.01"/><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/></svg>
         </span>
         <span class="tnode__lb truncate">未分组通道</span>
         <span class="tnode__c">${u}</span>
       </button>`;
}

/* ============================================================
   带 3 右：内容
   ============================================================ */
function renderPanel() {
  if (state.view === "picker") return renderPicker();
  const n = node(state.sel);
  if (!n) return renderUnassigned();

}

/* —— 添加通道（原位替换） —— */
function renderPicker() {
  const tgt = node(state.pkTarget);
  const kw = state.pkKw.trim().toLowerCase();
  const inCur = new Set((bindings[state.pkTarget] || []).map(c => c.code));
  const list = pool.filter(c => !kw || c.name.toLowerCase().includes(kw) || c.code.includes(kw));

  let share = 0, join = 0, move = 0;
  state.picked.forEach(code => {

    else if (s.share) join++;
    else share++;
  });

/* ============================================================
   底栏
   ============================================================ */
function renderFoot() {
  const c = state.chg;
  const any = c.share + c.join + c.move + c.out > 0 || state.dirty;
  const parts = [];
  if (c.share) parts.push(`新增共享 ${c.share}`);
  if (c.join)  parts.push(`加入 ${c.join}`);
  if (c.move)  parts.push(`移动 ${c.move}`);
  if (c.out)   parts.push(`移出 ${c.out}`);

  $("#foot").innerHTML = `
    <div class="foot__msg ${any ? "dirty" : "clean"}">
      <span class="dot"></span>
      ${any ? "有未保存修改" : "已保存"}
      ${parts.length ? `<em>· ${parts.map(p => `<b>${p}</b>`).join(" · ")}</em>` : ""}
    </div>
    <div class="foot__btns">
      <button class="btn" data-act="close">关闭</button>
      <button class="btn pri" data-act="save" ${any ? "" : "disabled"}>保存修改</button>
    </div>`;
}

/* ============================================================
   渲染
   ============================================================ */
function render() {
  renderSteps();
  $("#pubSwitch").checked = state.publish;
  renderTree();
  renderPanel();
  renderFoot();
}

/* ============================================================
   交互
   ============================================================ */
$("#pubSwitch").addEventListener("change", (e) => {
  state.publish = e.target.checked;
  toast(state.publish ? "已开启业务目录发布（保存后上级才可查询）" : "已关闭业务目录发布，通道共享仍然保留");
  render();
});
$("#pushBtn").addEventListener("click", () => toast("已向上级发送目录推送请求；推送成功 ≠ 上级已展示"));
$("#closeBtn").addEventListener("click", () => toast("关闭前会检查未保存修改（原型略）"));

document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-act],[data-node],[data-step]");
  if (!t) return;

  if (t.dataset.step) {
    const map = {
      tree: () => { state.sel = nodes.find(n => n.kind === "root")?.code; state.view = "node"; },
      bind: () => { state.sel = unassigned.length ? "__u__" : (orgs()[0]?.code || state.sel); state.view = "node"; },
      save: () => toast(state.dirty ? "点右下角「保存修改」提交" : "当前没有待保存的改动"),
      pub:  () => toast(state.publish ? "发布已开启，可执行「推送目录」" : "请打开右上角「业务目录发布」开关")
    };
    map[t.dataset.step]?.();
    return render();
  }

  if (t.classList.contains("tnode")) {
    state.sel = t.dataset.node; state.view = "node"; state.picked.clear();
    return render();
  }
  if (t.classList.contains("lk") && t.dataset.node) {
    state.sel = t.dataset.node; state.view = "node"; state.picked.clear();
    return render();
  }

  const a = t.dataset.act;
  switch (a) {
    case "add": {
      const parent = t.dataset.parent;
      const used = new Set(nodes.map(n => n.code));
      let code = parent;
      for (let i = 11; i < 99; i++) { const c = "340200000020000000" + String(i); if (!used.has(c)) { code = c; break; } }
      nodes.push({ code, name: "新建组织", kind: "org", parent });
      state.sel = code; state.view = "node"; state.dirty = true;
      toast("已新建组织（未保存）");
      return render();
    }
    case "del": return toast("删除空组织需要二次确认（原型略）");
    case "pick": state.view = "picker"; state.pkTarget = t.dataset.node; state.picked.clear(); state.pkKw = ""; return render();
    case "pk-cancel": state.view = "node"; state.picked.clear(); return render();
    case "scope": state.pkScope = t.dataset.v; state.picked.clear(); return render();
    case "pick-all": {
      const inC = new Set((bindings[state.pkTarget] || []).map(c => c.code));
      const kw2 = state.pkKw.trim().toLowerCase();
      const ls = pool.filter(c => (!kw2 || c.name.toLowerCase().includes(kw2) || c.code.includes(kw2)) && !inC.has(c.code));
      const all = ls.length > 0 && ls.every(c => state.picked.has(c.code));
      ls.forEach(c => all ? state.picked.delete(c.code) : state.picked.add(c.code));
      return render();
    }
    case "pk-apply": {
      const tgt = state.pkTarget;
      let add = 0, mv = 0, sh = 0;
      state.picked.forEach(code => {
        const s = pool.find(c => c.code === code);
        if (!s) return;
        let moved = false;
        Object.keys(bindings).forEach(k => {
          const i = bindings[k].findIndex(c => c.code === code);
          if (i >= 0) { bindings[k].splice(i, 1); moved = true; }
        });
        const ui = unassigned.findIndex(c => c.code === code);
        if (ui >= 0) unassigned.splice(ui, 1);
        if (moved) mv++; else if (s.share) add++; else sh++;
        bindings[tgt] = bindings[tgt] || [];
        bindings[tgt].push({ name: s.name, code: s.code, online: s.online });
      });
      const seen = new Set();
      bindings[tgt] = bindings[tgt].filter(c => seen.has(c.code) ? false : (seen.add(c.code), true));
      state.chg.join += add; state.chg.move += mv; state.chg.share += sh;
      state.dirty = true; state.view = "node"; state.picked.clear();
      toast(`已加入 ${add + mv + sh} 路通道（未保存）`);
      return render();
    }
    case "out": {
      const from = t.dataset.from, code = t.dataset.code;
      const i = bindings[from].findIndex(c => c.code === code);
      if (i >= 0) { const [c] = bindings[from].splice(i, 1); unassigned.push(c); }
      state.chg.out++; state.dirty = true;
      toast("已移出组织（未保存），通道仍然保持共享");
      return render();
    }
    case "move": {
      const code = t.dataset.code, from = t.dataset.from;
      const i = bindings[from].findIndex(c => c.code === code);
      if (i < 0) return;
      const [c] = bindings[from].splice(i, 1);
      const tgt = orgs().find(o => o.code !== from);
      if (tgt) { bindings[tgt.code] = bindings[tgt.code] || []; bindings[tgt.code].push(c); state.chg.move++; }
      state.dirty = true;
      toast(`已移动到「${tgt?.name || "其他组织"}」（未保存）`);
      return render();
    }
    case "assign": {
      const sel = $("#uSel")?.value;
      if (!sel) return toast("请先选择目标组织");
      let n = 0;
      bindings[sel] = bindings[sel] || [];
      [...state.picked].forEach(code => {
        const i = unassigned.findIndex(c => c.code === code);
        if (i >= 0) { const [c] = unassigned.splice(i, 1); bindings[sel].push(c); n++; }
      });
      state.chg.join += n; state.dirty = true; state.picked.clear();
      toast(`已归入 ${n} 路通道（未保存）`);
      return render();
    }
    case "save": {
      state.dirty = false;
      state.chg = { share: 0, join: 0, move: 0, out: 0 };
      toast("业务分组配置已保存");
      return render();
    }
    case "close": return toast("关闭前会检查未保存修改（原型略）");
  }
});

document.addEventListener("change", (e) => {
  const el = e.target;
  if (el.classList.contains("pick-c") || el.classList.contains("pick-u")) {
    el.checked ? state.picked.add(el.dataset.code) : state.picked.delete(el.dataset.code);
    return renderPanel();
  }
  if (el.id === "uAll") {
    state.picked = el.checked ? new Set(unassigned.map(c => c.code)) : new Set();
    return renderPanel();
  }
});

document.addEventListener("input", (e) => {
  if (e.target.id === "treeSearch") { state.kw = e.target.value; return renderTree(); }
  if (e.target.id === "pkKw") {
    state.pkKw = e.target.value;
    const pos = e.target.selectionStart;
    renderPanel();
    const el = $("#pkKw"); if (el) { el.focus(); el.setSelectionRange(pos, pos); }
    return;
  }
  if (e.target.dataset.act === "rename") {
    const n = node(e.target.dataset.node);
    if (n) { n.name = e.target.value; state.dirty = true; renderTree(); renderSteps(); renderFoot(); }
  }
});

render();
</script>
</body>
</html>
