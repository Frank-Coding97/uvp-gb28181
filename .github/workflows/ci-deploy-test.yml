name: CI

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
      - main
permissions:
  contents: read

concurrency:
  group: uvp-ci-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION: 1.25.6
  NODE_VERSION: 24.13.0
  PNPM_VERSION: 10.28.1

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: server/go.sum

      - name: Prepare backend test config
        working-directory: server
        run: cp config/config.example.yml config/config.yml

      - name: Test backend
        working-directory: server
        run: go test ./... -count=1

      - name: Build Linux backend
        working-directory: server
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: go build -trimpath -ldflags="-s -w" -o bin/uvp-gb28181-linux-amd64 main.go

      - name: Build Linux firewall agent
        working-directory: server
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: go build -trimpath -ldflags="-s -w" -o bin/uvp-firewall-agent-linux-amd64 ./cmd/uvp-firewall-agent

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Type-check and build frontend
        working-directory: web
        run: pnpm run build:prod

  mirror-gitee:
    name: Mirror verified develop to Gitee
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-24.04
    env:
      GITEE_PUSH_URL: ${{ secrets.GITEE_PUSH_URL }}

    steps:
      - name: Skip until the Gitee mirror credential is configured
        if: env.GITEE_PUSH_URL == ''
        run: echo 'GITEE_PUSH_URL is not configured; skipping mirror.'

      - name: Check out the verified revision
        if: env.GITEE_PUSH_URL != ''
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Fast-forward Gitee develop
        if: env.GITEE_PUSH_URL != ''
        run: |
          set -euo pipefail
          git remote add gitee "$GITEE_PUSH_URL"
          git push gitee HEAD:refs/heads/develop
