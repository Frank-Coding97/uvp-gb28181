<!doctype html><html><head><meta charset="UTF-8"><title>设备目录隔离渲染压测</title>
<link rel="stylesheet" href="/node_modules/@arco-design/web-vue/dist/arco.css"><style>html,body{margin:0;background:#101820;color:#ddd;font:14px sans-serif}#app{height:760px;width:320px}.directory-panel{height:100%;width:320px!important;min-width:320px!important}*{box-sizing:border-box}:root{--uvp-text-secondary:#cbd5e1;--uvp-text-primary:#eee;--uvp-text-tertiary:#94a3b8;--uvp-panel-bg:#101820;--uvp-panel-border:#344556;--uvp-brand:#4299ff;--uvp-danger:#ef4444}</style></head><body><div id="app"></div>
<script type="module">
import { createApp, h, ref, nextTick } from "__VUE_URL__";
import DirectoryPanel from "/src/views/gb28181/device-mgmt/components/DirectoryPanel.vue";
import { createDirectoryState } from "/src/views/gb28181/device-mgmt/directoryState.ts";

let app,panel,state;
const tasks=[];
new PerformanceObserver(list=>tasks.push(...list.getEntries().map(x=>({start:x.startTime,duration:x.duration})))).observe({type:'longtask',buffered:true});
const frame = () => new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
window.loadFixture = async n => {
  window.__payload=await (await fetch('/__directory_load/data?n='+n)).json();
};
window.mountFixture=async()=>{
  state=ref(createDirectoryState());panel=ref();
  const start=performance.now();
  app=createApp({setup(){return()=>h(DirectoryPanel,{ref:panel,modelValue:state.value,'onUpdate:modelValue':v=>state.value=v,canManage:false,selectedDeviceId:null});}});
  app.mount('#app');
  await nextTick();await frame();
  return {mount_ms:performance.now()-start,rows:document.querySelectorAll('.directory-row').length,dom_nodes:document.querySelectorAll('*').length};
};
window.exercise=async()=>{
  const timed=async fn=>{const start=performance.now();await fn();await nextTick();await frame();return performance.now()-start;};
  const full=window.__payload;
  const tree=document.querySelector('.directory-tree');
  tree.scrollTop=1000;await frame();
  const beforeScroll=tree.scrollTop;
  window.__payload={code:0,data:{reset:false,revision:full.data.revision,roots:full.data.list.map(n=>n.key),upserts:[],removed:[]}};
  const noChange=await timed(()=>panel.value.sync());
  const afterNoChange=tree.scrollTop;
  let leaf;
  const walk=nodes=>{for(const n of nodes){if(n.device&&!leaf)leaf=n;walk(n.children||[])}};walk(full.data.list);
  window.__payload={code:0,data:{...window.__payload.data,revision:'changed',upserts:[{node:{...leaf,device:{...leaf.device,online:!leaf.device.online}},children:[]}]}};
  const delta=await timed(()=>panel.value.sync());
  const collapse=await timed(()=>state.value={...state.value,expandedKeys:{...state.value.expandedKeys,national:[]}});
  const expandKeys=[];const keys=nodes=>nodes.forEach(n=>{if(n.children?.length){expandKeys.push(n.key);keys(n.children)}});keys(full.data.list);
  const expand=await timed(()=>state.value={...state.value,expandedKeys:{...state.value.expandedKeys,national:expandKeys}});
  const search=await timed(()=>state.value={...state.value,treeKeyword:'000001'});
  const matches=document.querySelectorAll('.directory-row').length;
  await timed(()=>state.value={...state.value,treeKeyword:''});
  const gaps=[];let last=performance.now();
  await new Promise(resolve=>{let i=0;function tick(now){gaps.push(now-last);last=now;tree.scrollTop+=60;if(++i<30)requestAnimationFrame(tick);else resolve()}requestAnimationFrame(tick)});
  await frame();
  return {unchanged_ms:noChange,status_delta_ms:delta,collapse_ms:collapse,expand_ms:expand,search_ms:search,search_rows:matches,scroll_preserved:beforeScroll===afterNoChange,max_scroll_frame_ms:Math.max(...gaps),slow_scroll_frames:gaps.filter(x=>x>50).length,long_tasks:tasks.length,max_long_task_ms:Math.max(0,...tasks.map(x=>x.duration)),heap_used:performance.memory?.usedJSHeapSize};
};
window.__ready=true;
</script></body></html>
